##################################################################################################

##################################################################################################
# General Stuff 
##################################################################################################

##################################
# Specs Xplorer
##################################

[printer]
max_velocity: 500
max_accel: 6000
max_z_velocity: 40
max_z_accel: 300
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
kinematics: generic_cartesian

##################################
#  Xplorer specific modules
##################################

[xplorer]               # imports the py modules for the Xplorer into klippy/extras

[trsync_patch]          # when 'True' it increases TRSYNC_TIMEOUT to 0.050 (Klipper default is 0.025) in order to avoid communication errors between the MCUs and the host.
enabled: True

##################################
# Folder to save variables
##################################

[save_variables]
filename:~/printer_data/config/variables.cfg

##################################
# Force Move
##################################

[force_move]
enable_force_move: True

##################################
# Input Shaper
##################################

[input_shaper]

##################################
# Calibrate endstop phases
##################################

[endstop_phase]

##################################
# Support SDCard looping
##################################

[sdcard_loop]

##################################
# Exclude Objects
##################################

[exclude_object]

##################################
# Enable skew correction
##################################

[skew_correction]

##################################
# Enable arcs support
##################################

[gcode_arcs]
resolution: 0.5

##################################
# idle timeout
##################################

[idle_timeout]
TIMEOUT: 3600 #1 hour

##################################
# Respond
##################################

[respond]
default_type: echo

##################################
# Firmware Retraction
##################################

[firmware_retraction]
retract_length: .8 
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 60
#   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 60
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

##################################################################################################
# Manta M8P V2 Related 
##################################################################################################

##################################
# Temperature Sensors
##################################

[temperature_sensor Mainboard]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor Host]
sensor_type: temperature_host

##################################
# Temperature Fans
##################################

[controller_fan Electronics_fan]
pin: PA4 #Manta M8P V2.0 # PC12 # Manta M8P V1.1
max_power: 1.0
shutdown_speed: 0
fan_speed: 1.0
idle_timeout: 60

##################################
# Print bed
##################################

[heater_bed]
heater_pin: PA0 # BTT M8P V2.0 // PE3 #BTT M8P V1.1                    
sensor_type: Generic 3950
sensor_pin: PB1 # BTT M8P V2.0 // PA0 #BTT M8P V1.1                       
min_temp: 0
max_temp: 125

[verify_heater heater_bed]
max_error: 10
check_gain_time: 120
hysteresis: 2


##################################
# Case light
##################################

[output_pin caselight]
pin: PA1 # BTT M8P V2.0 // PB5 #BTT M8P V1.1 
pwm:true
cycle_time: 0.01
value: 1
shutdown_value: 0

##################################
# Power ON/OFF
##################################

[output_pin Power]
pin: PD14 # BTT M8P V2.0 // PC3 #BTT M8P V1.1
value: 1

##################################################################################################
# X Axis
##################################################################################################

##################################
# Carriage Tool1
##################################

[carriage t0]
axis: x
endstop_pin:~Tool0: PA10
position_min: -1
position_endstop: 0
position_max: 345
homing_speed: 180
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10

[stepper x]
carriages: t0
step_pin: Tool0: PB4
dir_pin: !Tool0: PB5
enable_pin: !Tool0:PC13
microsteps: 16
rotation_distance: 31.5 

[tmc2209 stepper x]
uart_pin: Tool0:PB3
run_current: 0.6
hold_current: 0.25
interpolate: false
sense_resistor: 0.05
stealthchop_threshold: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 0

##################################
# Carriage Tool1
##################################

[dual_carriage t1]
primary_carriage: t0
safe_distance: 60
endstop_pin:~Tool1: PA10
position_min: 70
position_endstop: 421
position_max: 422
homing_speed: 180
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10

[stepper x1]
carriages: t1
step_pin: Tool1:PB4
dir_pin: !Tool1:PB5
enable_pin: !Tool1:PC13
microsteps: 16
rotation_distance: 31.5

[tmc2209 stepper x1]
uart_pin: Tool1:PB3
run_current: 0.6
hold_current: 0.25
interpolate: false
sense_resistor: 0.05
stealthchop_threshold: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 0

##################################
# Carriage Tool2
##################################

[dual_carriage t2]
axis: x
endstop_pin: ~Tool2: PA10
position_min: -1
position_endstop: 0
position_max: 340
homing_speed: 180
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10
#homing_positive_dir:

[stepper x2]
carriages: t2
step_pin: Tool2: PB4
dir_pin: Tool2: PB5
enable_pin: !Tool2:PC13
microsteps: 16
rotation_distance: 31.5

[tmc2209 stepper x2]
uart_pin: Tool2:PB3
run_current: 0.7
hold_current: 0.25
interpolate: false
sense_resistor: 0.05
stealthchop_threshold: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 0

##################################
# Carriage Tool3
##################################

[dual_carriage t3]
primary_carriage: t2
safe_distance: 50
endstop_pin:~Tool3: PA10
position_min: 70
position_endstop: 421
position_max: 422
homing_speed: 180
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10

[stepper x3]
carriages: t3
step_pin: Tool3:PB4
dir_pin: Tool3:PB5
enable_pin: !Tool3:PC13
microsteps: 16
rotation_distance: 31.5

[tmc2209 stepper x3]
uart_pin: Tool3:PB3
run_current: 0.7
hold_current: 0.25
