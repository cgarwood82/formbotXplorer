#       BACK side of the printer    ##
#                                   ##
#       Y                   Y1      ##
#                                   ##
#       Y2                   Y3     ##
#     Front side of the printer    ##


#  Back side of the printer  ##

######################################
##### Rear side of the printer  #####
######################################

[carriage gantry0]
axis: y
endstop_pin: ~PF3
position_endstop: 391.5
position_max: 392
position_min: 77.5
homing_speed: 150
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10

[stepper y]
carriages: gantry0
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 40.5

[tmc2209 stepper y]
uart_pin: PD5
run_current: 1.1
hold_current: 0.6
interpolate: true
stealthchop_threshold: 99999

[stepper y1]
carriages: gantry0
step_pin: PC7
dir_pin: PC8
enable_pin: !PD2
microsteps: 16
rotation_distance: 40.5

[tmc2209 stepper y1]
uart_pin: PC6
run_current: 1.1
hold_current: 0.6
interpolate: true
stealthchop_threshold: 99999

######################################
##### Front side of the printer  #####
######################################

[dual_carriage gantry1]
safe_distance: 27
primary_carriage: gantry0
endstop_pin: ~PF4
position_endstop: 0
position_max: 392
position_min: -1
homing_speed: 150
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10

[stepper y2]
carriages: gantry1
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 40.5

[tmc2209 stepper y2]
uart_pin: PG10
run_current: 1.1
hold_current: 0.6
interpolate: true
stealthchop_threshold: 99999

[stepper y3]
carriages: gantry1
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 40.5

[tmc2209 stepper y3]
uart_pin: PG14
run_current: 1.1
hold_current: 0.6
interpolate: true
stealthchop_threshold: 99999

##################################
# Z Axis -- 3 Steppers
##################################

#   BACK of the printer   #
#                         #
#           Z1            #
#                         #
#       Z       Z2        #
#                         #
#   FRONT of the printer  #

##################################################################################################
# Z Axis
##################################################################################################

######################################
#####        Front Left Z        #####
######################################

[carriage z]
axis: z
endstop_pin: ~PF1
position_endstop: 393
position_max: 393
position_min: -3
homing_speed: 20
homing_retract_dist: 10.0
homing_retract_speed: 10
second_homing_speed: 5

[stepper z]
carriages: z
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z]
uart_pin: PC13
run_current: 1.0
stealthchop_threshold: 999999

######################################
#####        Rear Z              #####
######################################

[extra_carriage z1]
primary_carriage: z
endstop_pin: ~PF0

[stepper z1]
carriages: z1
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z1]
uart_pin: PE3
run_current: 1.0
stealthchop_threshold: 999999

######################################
#####      Front Right Z         #####
######################################

[extra_carriage z2]
primary_carriage: z
endstop_pin: ~PC15

[stepper z2]
carriages: z2
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z2]
uart_pin: PB9
run_current: 1.0
stealthchop_threshold: 999999

