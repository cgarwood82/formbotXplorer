# board: BTT_Manta_M8P_V2.0
# The CM5 sits on the M8P and the H723 talks to it over USB (PA11/PA12)
# through the onboard hub. Firmware is the USB build in
# 0_Xplorer/.9_MCU_Flash/MCU_config/BTT_Manta_M8P_V2.0/.config (128KiB
# bootloader offset). Known-good reflash: hold BOOT0 + tap RESET for ROM DFU,
# then `sudo make flash FLASH_DEVICE=0483:df11` in ~/klipper-mainline.
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0B0035001051313234353230-if00
