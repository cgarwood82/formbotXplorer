# board: BTT_Manta_M8P_V2.0
# Runtime comms go through a CH340 USB-UART bridge into the M8P's USART1
# header (250000 baud). The previous `flash_device:` override pointed at
# the Turtle's H7 by mistake (only one stm32h723xx was on USB and it was
# not the M8P) -- removed. Flashing the M8P now requires either plugging
# its USB-C back into the Pi, SD-card flash, or BOOT0+reset for ROM DFU.
[mcu]
serial: /dev/ttyUSB0
baud: 250000
restart_method: command
