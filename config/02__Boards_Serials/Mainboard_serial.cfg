# board: BTT_Manta_M8P_V2.0
# Runtime comms go through a CH340 USB-UART bridge into the M8P's USART1
# header (250000 baud). Flashing still has to reach the H7's DFU device
# over the M8P's native USB port, so the flash script honours an override:
# flash_device: /dev/serial/by-id/usb-Klipper_stm32h723xx_1E000E001351333333343930-if00
[mcu]
serial: /dev/ttyUSB0
baud: 250000
restart_method: command
