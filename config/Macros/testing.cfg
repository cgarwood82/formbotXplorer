[gcode_shell_command hello_world]
command: echo hello world
timeout: 5
verbose: True

[gcode_macro script]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world

[gcode_shell_command shellScript]
command: sh ~/meow.sh
timeout: 5
verbose: True

[gcode_macro script2]
gcode:
    RUN_SHELL_COMMAND CMD=shellScript

[gcode_shell_command shellScript1]
command: sh "$HOME/meow.sh"
timeout: 5
verbose: True

[gcode_macro script3]
gcode:
    RUN_SHELL_COMMAND CMD=shellScript

[gcode_shell_command shellScript2]
