[gcode_macro _PARK_AND_DISABLE_TOOL]
gcode:
    {% set park_gantry0 = printer.dual_carriage.carriages["carriage t0"] == "INACTIVE" and printer.dual_carriage.carriages["dual_carriage t1"] == "INACTIVE" and params.CARRIAGE in ['t0', 't1'] %}
    {% set park_gantry1 = printer.dual_carriage.carriages["dual_carriage t2"] == "INACTIVE" and printer.dual_carriage.carriages["dual_carriage t3"] == "INACTIVE" and params.CARRIAGE in ['t2', 't3'] %}
    SAVE_GCODE_STATE NAME=disable_tool
    {% if park_gantry0 %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=INACTIVE
    {% endif %}
    {% if park_gantry1 %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=INACTIVE
    {% endif %}
    SAVE_DUAL_CARRIAGE_STATE NAME=disable_tool
    SET_DUAL_CARRIAGE CARRIAGE={params.CARRIAGE}
    {% if park_gantry0 %}
        {% set park_y = "Y" ~ printer.configfile.settings["carriage gantry0"].position_max %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry0
    {% elif park_gantry1 %}
        {% set park_y = "Y" ~ printer.configfile.settings["dual_carriage gantry1"].position_min %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry1
    {% else %}
        {% set park_y = "" %}
    {% endif %}
    # PARKING_POSITION and park_y come from the *machine* axis limits
    # (position_min/position_max), but G1 is interpreted in the tool-offset-adjusted
    # coordinate space. With a tool offset applied the park target lands outside the
    # limit and the move is rejected -- e.g. DISABLE_T0 targets carriage t0
    # position_min -1.0, and with T1 active (x1offset 0.246875) that resolves to
    # -1.246875, which is 0.246875mm past the hard stop. The macro aims at the limit
    # with zero margin, so any non-zero offset in the shrinking direction breaks it.
    # This only ever worked because T0 is the datum tool and its offset is 0.
    #
    # Park in machine coordinates instead. SAVE_GCODE_STATE above captured
    # base_position and homing_position, and RESTORE_GCODE_STATE below puts both
    # back, so this is self-contained. Z is deliberately left alone -- no Z move here.
    SET_GCODE_OFFSET X=0 Y=0

    M118 PARK_AND_DISABLE_TOOL: moving to X{params.PARKING_POSITION} {park_y}
    G1 X{params.PARKING_POSITION} {park_y} F12000
    M117 G1 X{params.PARKING_POSITION} {park_y} F12000
    SYNC_EXTRUDER_MOTION EXTRUDER={params.EXTRUDER} MOTION_QUEUE=
    RESTORE_DUAL_CARRIAGE_STATE NAME=disable_tool MOVE=0
    RESTORE_GCODE_STATE NAME=disable_tool MOVE=0

[gcode_macro DISABLE_T0]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t0 EXTRUDER=extruder PARKING_POSITION={printer.configfile.settings["carriage t0"].position_min}

[gcode_macro DISABLE_T1]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t1 EXTRUDER=extruder1 PARKING_POSITION={printer.configfile.settings["dual_carriage t1"].position_max}

[gcode_macro DISABLE_T2]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t2 EXTRUDER=extruder2 PARKING_POSITION={printer.configfile.settings["dual_carriage t2"].position_min}

[gcode_macro DISABLE_T3]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t3 EXTRUDER=extruder3 PARKING_POSITION={printer.configfile.settings["dual_carriage t3"].position_max}

[gcode_macro DISABLE_TOOL_RECOVER]
description: Restore carriage/gcode state after a failed DISABLE_Tx
gcode:
    # Klipper gcode macros have no try/finally, so if the G1 in
    # _PARK_AND_DISABLE_TOOL is rejected the macro aborts part-way through and its
    # RESTORE_DUAL_CARRIAGE_STATE / RESTORE_GCODE_STATE never run. That leaves the
    # requested carriage activated, the gantry possibly INACTIVE, the extruder still
    # synced, and both saved states orphaned -- a corrupted carriage configuration
    # mid-print rather than a cleanly rejected command.
    #
    # Run this by hand after such a failure. It errors with "Unknown ... state" if
    # there is nothing saved, which simply means the macro completed normally.
    RESTORE_DUAL_CARRIAGE_STATE NAME=disable_tool MOVE=0
    RESTORE_GCODE_STATE NAME=disable_tool MOVE=0
