[gcode_macro _PARK_AND_DISABLE_TOOL]
gcode:
    # Park targets are pulled park_margin mm inside the axis limit rather than
    # aimed exactly at it. See the note below the offset reset for why zero margin
    # cannot work here.
    {% set park_margin = 2.0 %}
    {% set park_gantry0 = printer.dual_carriage.carriages["carriage t0"] == "INACTIVE" and printer.dual_carriage.carriages["dual_carriage t1"] == "INACTIVE" and params.CARRIAGE in ['t0', 't1'] %}
    {% set park_gantry1 = printer.dual_carriage.carriages["dual_carriage t2"] == "INACTIVE" and printer.dual_carriage.carriages["dual_carriage t3"] == "INACTIVE" and params.CARRIAGE in ['t2', 't3'] %}
    SAVE_GCODE_STATE NAME=disable_tool
    {% if park_gantry0 %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=INACTIVE
    {% endif %}
    {% if park_gantry1 %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=INACTIVE
    {% endif %}
    SAVE_DUAL_CARRIAGE_STATE NAME=disable_tool
    SET_DUAL_CARRIAGE CARRIAGE={params.CARRIAGE}
    {% if park_gantry0 %}
        {% set park_y = "Y" ~ (printer.configfile.settings["carriage gantry0"].position_max - park_margin) %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry0
    {% elif park_gantry1 %}
        {% set park_y = "Y" ~ (printer.configfile.settings["dual_carriage gantry1"].position_min + park_margin) %}
        SET_DUAL_CARRIAGE CARRIAGE=gantry1
    {% else %}
        {% set park_y = "" %}
    {% endif %}
    # PARKING_POSITION and park_y come from the *machine* axis limits
    # (position_min/position_max), but G1 is interpreted in the tool-offset-adjusted
    # coordinate space. With a tool offset applied the park target lands outside the
    # limit and the move is rejected -- e.g. DISABLE_T0 targets carriage t0
    # position_min -1.0, and with T1 active (x1offset 0.246875) that resolves to
    # -1.246875, which is 0.246875mm past the hard stop. The macro aims at the limit
    # with zero margin, so any non-zero offset in the shrinking direction breaks it.
    # This only ever worked because T0 is the datum tool and its offset is 0.
    #
    # Park in machine coordinates instead. SAVE_GCODE_STATE above captured
    # base_position and homing_position, and RESTORE_GCODE_STATE below puts both
    # back, so this is self-contained. Z is deliberately left alone -- no Z move here.
    SET_GCODE_OFFSET X=0 Y=0

    # Zeroing the gcode offset is NOT sufficient: [skew_correction] is a move
    # transform that runs after gcode_move and before the kinematic limit check
    # (gcode_move -> skew_correction.move -> bed_mesh -> toolhead.check_move), so a
    # target sitting exactly on the limit gets pushed past it. skew_correction
    # applies
    #     skewed_x = x - y * xy_factor
    # and with the gantry0 profile (xy_factor -0.0026013) that is a POSITIVE push:
    # DISABLE_T1 aiming at dual_carriage t1 position_max 422.0 with the toolhead at
    # Y=252.5 resolves to 422.657 and is rejected. Over the full Y travel the push
    # reaches 1.02mm on the gantry0 profile, and 1.10mm on gantry1 (xy_factor
    # +0.0027998, which pushes the other way and breaks the position_min parks
    # instead). The macro cannot correct for this itself -- skew_correction exports
    # only current_profile_name in its status, not the factors, so the Jinja here has
    # no way to read xy_factor and un-skew the target.
    #
    # Hence park_margin: park 2.0mm inside the limit, clearing the 1.10mm worst-case
    # push with room to spare. 2mm of park travel is irrelevant for getting a
    # carriage out of the way, and it also covers ordinary float noise on a target
    # that would otherwise sit exactly on the boundary.

    M118 PARK_AND_DISABLE_TOOL: moving to X{params.PARKING_POSITION} {park_y}
    G1 X{params.PARKING_POSITION} {park_y} F12000
    M117 G1 X{params.PARKING_POSITION} {park_y} F12000
    # --- Hand over the E axis before detaching this tool ------------------
    # In COPY/MIRROR mode exactly ONE extruder is the toolhead's E axis
    # (ACTIVATE_EXTRUDER) and every other tool is SYNC_EXTRUDER_MOTION'd onto its
    # motion queue. Klipper gates ALL extrusion on the ACTIVE extruder's
    # temperature (PrinterExtruder.check_move -> heater.can_extrude), so cooling
    # the active extruder kills the whole print, not just this tool.
    #
    # That is exactly what happened on 2026-09-03: DISABLE_T0 during a 4-up copy
    # print set extruder TARGET=0 at 14:45:48 (259.6C); it crossed
    # min_extrude_temp 180C at 14:46:48 and the print died on "Extrude below
    # minimum temp" 60s after the command, while T2/T3 were still printing fine.
    # DISABLE_T1 an hour earlier was harmless because extruder1 was only a
    # follower -- which is why T0 behaved differently from every other tool.
    #
    # So: if the tool being disabled owns the E axis, promote a surviving tool
    # and move the other survivors onto its queue FIRST (set up the new queue
    # before tearing down the old one, so the copies are never orphaned). Only
    # then detach and cool this one. Safe with relative E (M83, what Orca emits);
    # RESTORE_GCODE_STATE re-bases E via base_position, it does not force
    # last_position[3], so the handoff does not jump the extruder.
    #
    # If nothing survives, keep the heater ON -- there is nobody to hand off to
    # and cooling would strand a print that is still running.
    {% set tool_map = [("carriage t0", "extruder"),
                       ("dual_carriage t1", "extruder1"),
                       ("dual_carriage t2", "extruder2"),
                       ("dual_carriage t3", "extruder3")] %}
    {% set dc = printer.dual_carriage.carriages %}
    {% set ns = namespace(survivor=none) %}
    {% for cname, ext in tool_map %}
        {% if ns.survivor is none and ext != params.EXTRUDER
              and dc.get(cname, "INACTIVE") != "INACTIVE" %}
            {% set ns.survivor = ext %}
        {% endif %}
    {% endfor %}
    {% set owns_e_axis = (params.EXTRUDER == printer.toolhead.extruder) %}

    {% if owns_e_axis and ns.survivor %}
        M118 DISABLE: {params.EXTRUDER} owns the E axis -- handing over to {ns.survivor}
        SYNC_EXTRUDER_MOTION EXTRUDER={ns.survivor} MOTION_QUEUE={ns.survivor}
        ACTIVATE_EXTRUDER EXTRUDER={ns.survivor}
        {% for cname, ext in tool_map %}
            {% if ext not in [params.EXTRUDER, ns.survivor]
                  and dc.get(cname, "INACTIVE") != "INACTIVE" %}
                SYNC_EXTRUDER_MOTION EXTRUDER={ext} MOTION_QUEUE={ns.survivor}
            {% endif %}
        {% endfor %}
    {% endif %}

    SYNC_EXTRUDER_MOTION EXTRUDER={params.EXTRUDER} MOTION_QUEUE=

    {% if owns_e_axis and not ns.survivor %}
        M118 DISABLE: {params.EXTRUDER} drives the E axis and no other tool is active -- leaving its heater ON
    {% else %}
        SET_HEATER_TEMPERATURE HEATER={params.EXTRUDER} TARGET=0
    {% endif %}

    RESTORE_DUAL_CARRIAGE_STATE NAME=disable_tool MOVE=0
    RESTORE_GCODE_STATE NAME=disable_tool MOVE=0

[gcode_macro DISABLE_T0]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t0 EXTRUDER=extruder PARKING_POSITION={printer.configfile.settings["carriage t0"].position_min + 2.0}

[gcode_macro DISABLE_T1]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t1 EXTRUDER=extruder1 PARKING_POSITION={printer.configfile.settings["dual_carriage t1"].position_max - 2.0}

[gcode_macro DISABLE_T2]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t2 EXTRUDER=extruder2 PARKING_POSITION={printer.configfile.settings["dual_carriage t2"].position_min + 2.0}

[gcode_macro DISABLE_T3]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE
    _PARK_AND_DISABLE_TOOL CARRIAGE=t3 EXTRUDER=extruder3 PARKING_POSITION={printer.configfile.settings["dual_carriage t3"].position_max - 2.0}

[gcode_macro DISABLE_TOOL_RECOVER]
description: Restore carriage/gcode state after a failed DISABLE_Tx
gcode:
    # Klipper gcode macros have no try/finally, so if the G1 in
    # _PARK_AND_DISABLE_TOOL is rejected the macro aborts part-way through and its
    # RESTORE_DUAL_CARRIAGE_STATE / RESTORE_GCODE_STATE never run. That leaves the
    # requested carriage activated, the gantry possibly INACTIVE, the extruder still
    # synced, and both saved states orphaned -- a corrupted carriage configuration
    # mid-print rather than a cleanly rejected command.
    #
    # Run this by hand after such a failure. It errors with "Unknown ... state" if
    # there is nothing saved, which simply means the macro completed normally.
    RESTORE_DUAL_CARRIAGE_STATE NAME=disable_tool MOVE=0
    RESTORE_GCODE_STATE NAME=disable_tool MOVE=0
