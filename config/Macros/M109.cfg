[gcode_macro M109]
rename_existing: M99109
gcode:
  # Accept S or R (some gcode uses R for "wait")
  {% set target = (params.S|default(params.R|default(0)))|float %}
  {% set tol = 2.0 %}

  # Determine which extruder is being targeted
  {% if params.T is defined %}
    {% set t = params.T|int %}
    {% set sensor = "extruder" if t == 0 else "extruder%d" % t %}
    M104 S{target} T{t}
  {% else %}
    # printer.toolhead.extruder is "extruder", "extruder1", etc.
    {% set sensor = printer.toolhead.extruder %}
    M104 S{target}
  {% endif %}

  # Only wait if target > 0, and only require "hot enough"
  {% if target > 0 %}
    TEMPERATURE_WAIT SENSOR={sensor} MINIMUM={target - tol}
  {% endif %}
