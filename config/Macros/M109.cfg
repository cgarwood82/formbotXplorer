[gcode_macro M109]
rename_existing: M99109
gcode:
  # Accept S or R (some gcode uses R for "wait")
  {% set target = (params.S|default(params.R|default(0)))|float %}
  {% set tol = 2.0 %}

  # AFC T-numbers are LANE indices, not Klipper extruder indices. Lanes 1-4 all feed
  # `extruder` (head 0); T4/T5/T6 are the toolhead lanes on extruder1/2/3. The old
  # "extruder%d" % t rule was correct only for T0 -- it aimed T1-T3 at heads holding
  # no filament, and named extruder4/5/6, which do not exist, for T4-T6. Ask the lane
  # which extruder it feeds instead, so a re-mapped lane stays correct.
  # Turtle lanes are [AFC_stepper <name>]; toolhead lanes are [AFC_lane <name>].
  {% set ns = namespace(sensor=none) %}
  {% if params.T is defined %}
    {% set t = params.T|int %}
    {% if printer.AFC is defined %}
      {% for lane in printer.AFC.lanes %}
        {% set obj = ("AFC_stepper " ~ lane) if ("AFC_stepper " ~ lane) in printer else ("AFC_lane " ~ lane) %}
        {% if obj in printer and printer[obj].map == ("T" ~ t) %}
          {% set ns.sensor = printer[obj].extruder %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {% if ns.sensor is none %}
      M118 M109 - no AFC lane maps to T{t}, using active extruder
      {% set ns.sensor = printer.toolhead.extruder %}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER={ns.sensor} TARGET={target}
  {% else %}
    {% set ns.sensor = printer.toolhead.extruder %}
    M104 S{target}
  {% endif %}

  # Only wait if target > 0, and only require "hot enough"
  {% if target > 0 %}
    TEMPERATURE_WAIT SENSOR={ns.sensor} MINIMUM={target - tol}
  {% endif %}
