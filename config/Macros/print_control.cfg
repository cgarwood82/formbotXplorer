[gcode_macro PRINT_START]
description: Centralized start sequence with optional multi-extruder + chamber (IDEX/IQEX aware)
# Usage:
#  PRINT_START BED=60 EXTRUDER=220 [EXTRUDER1=210] [EXTRUDER2=0] [EXTRUDER3=0] [CHAMBER=40]

gcode:
    {% set bed      = params.BED|default(0)|float %}
    {% set chamber  = params.CHAMBER|default(0)|float %}
    {% set t0 = params.EXTRUDER|default(0)|float %}
    {% set t1 = params.EXTRUDER1|default(0)|float %}
    {% set t2 = params.EXTRUDER2|default(0)|float %}
    {% set t3 = params.EXTRUDER3|default(0)|float %}
    {% set t4 = params.EXTRUDER4|default(0)|float %}
    {% set t5 = params.EXTRUDER5|default(0)|float %}
    {% set t6 = params.EXTRUDER6|default(0)|float %}
    {% set tool_temps = [t0,t1,t2,t3,t4,t5,t6] %}
    {% set initial_tool = params.INITIAL_TOOL|default(0)|int %}
    {% set initial_temp = tool_temps[initial_tool] %}
    {% set heater_map = ["extruder","extruder","extruder","extruder","extruder1","extruder2","extruder3"] %}
    {% set initial_heater = heater_map[initial_tool] %}
    {% set e_shared = initial_temp if initial_tool < 4 else 0 %}
    {% set e1 = t4 %}
    {% set e2 = t5 %}
    {% set e3 = t6 %}
    {% set afc_hot = 1 if (t0 > 0 or t1 > 0 or t2 > 0 or t3 > 0) else 0 %}
    # Fallbacks only -- these describe the FIRST LAYER (Orca sends first_layer_print_min/max).
    # The real bounds are derived from the exclude_object polygons further down.
    # The old 449 default predates removing the dead space no gantry could reach; the
    # machine's own axis maximum is the truth, so ask the toolhead instead of hardcoding.
    {% set param_min_y = params.MIN_Y|default(0)|float %}
    {% set param_max_y = params.MAX_Y|default(printer.configfile.settings["carriage gantry0"].position_max)|float %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}

    # --- Setup ---
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150      # force probe temp to override slicer pre-heat when using ooze prevention
    SET_GCODE_OFFSET Z=0                                   # Reset Z offset
    G28                                                    # Home all axes
    G90                                                    # Absolute positioning

    # -- Step 0: Heat Chamber (optional, non-blocking) ---
    {% if chamber|default(0)|float > 0 %}
        # Get the bed away from the heater blast at the home position
        # If Z isn't homed yet, home it (or at least Z) before moving.
        {% if "z" not in printer.toolhead.homed_axes %}
            G28 Z
        {% endif %}
        G90
        G1 Z100 F3000

        # Set chamber temp WITHOUT waiting
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={chamber|float}
    {% endif %}


    # --- Step 1: Bed heat (optional) ---
    {% if bed > 0 %}
        SET_DISPLAY_TEXT MSG='Heating Bed: { bed }°C'
        M140 S{bed}
        M190 S{bed}
    {% endif %}

    # --- Step 1b: Bed heat-soak -------------------------------------------
    # The AC bed reaches its setpoint far faster than the plate saturates, so
    # probing straight after M190 measures a bed that is still moving --
    # z-tilt, mesh and touch-home all land on geometry that keeps changing
    # underneath them. Hold at temperature first.
    #
    # Duration: SOAK=<minutes> parameter, else the bed_soak_min saved variable,
    # else 15. Living in variables.cfg (like idexsquish/tprobe) means the
    # default is retunable with SAVE_VARIABLE, no restart and no config edit.
    #
    # Emitted as one-minute dwells with a countdown rather than a single long
    # G4, so the UI shows progress instead of appearing hung. NOTE this does
    # not make the soak abortable -- every dwell is queued when this macro
    # renders, so a cancel still waits for the queue to drain.
    #
    # The nozzle stays at its 150C probe temp: TANGO_TIME runs Brush_Tool0
    # before it probes, so any ooze during the hold is cleaned up anyway.
    {% set soak_min = (params.SOAK|default(printer.save_variables.variables.bed_soak_min|default(15)))|int %}
    {% if bed > 0 and soak_min > 0 %}
        SET_DISPLAY_TEXT MSG='Bed soak: { soak_min } min at { bed }°C'
        # Do not leave the nozzle parked a fraction of a mm over a hot plate
        # for a quarter of an hour.
        G90
        G1 Z100 F3000
        {% for i in range(soak_min) %}
            SET_DISPLAY_TEXT MSG='Bed soak: { soak_min - i } min left ({ bed }°C)'
            G4 P60000
        {% endfor %}
        SET_DISPLAY_TEXT MSG='Bed soak complete'
    {% endif %}

    # --- Step 2: Any pre-cal/align routine you use ---
    TANGO_TIME EXTRUDER={afc_hot} EXTRUDER1={e1} EXTRUDER2={e2} EXTRUDER3={e3}

    # Set dynamic park positions now that homing/tilt/brush are done.
    #
    # Park clearance has to cover the TALLEST part of the model, not its first layer.
    # MIN_Y/MAX_Y come from first_layer_print_min/max, so a model that flares outward as
    # it climbs -- organic shapes especially -- reaches past the box this math was given,
    # and the printing gantry taps the parked one. That is not theoretical: a print whose
    # first layer ended at Y=268.5 actually reached Y=294.1, so gantry0 parked 26 mm too
    # far forward and sat 13 mm inside the mechanical clearance.
    #
    # Klipper already knows the true XY footprint. Orca emits EXCLUDE_OBJECT_DEFINE before
    # PRINT_START, so the polygons are registered by the time this runs. Fall back to the
    # passed first-layer params when object labelling is off.
    {% set ys = [] %}
    {% for ob in printer.exclude_object.objects %}
        {% for pt in ob.polygon|default([]) %}{% set _ = ys.append(pt[1]|float) %}{% endfor %}
    {% endfor %}
    {% set min_y = ys|min if ys else param_min_y %}
    {% set max_y = ys|max if ys else param_max_y %}

    # Uses park_safe_dist from variables.cfg — the real mechanical clearance
    # between gantries, independent of printer.cfg safe_distance which may be
    # set lower to allow calibration probe reach.
    {% set safe_dist = printer.save_variables.variables.park_safe_dist|float %}
    # Each gantry has its OWN Y range and they are not the same -- gantry0 cannot come
    # forward past its position_min because gantry1 is in front of it on the shared rail.
    # printer.toolhead.axis_* reports only the ACTIVE carriage, so using it would clamp the
    # parked gantry against the printing gantry's limits. Read each carriage's own config,
    # the same way iqex_excludes.cfg does.
    {% set g1 = printer.configfile.settings["dual_carriage gantry1"] %}
    {% set g0 = printer.configfile.settings["carriage gantry0"] %}
    {% set axis_min_y = g1.position_min|float %}
    {% set axis_max_y = g0.position_max|float %}
    {% set want_min = min_y - safe_dist - 10 %}
    {% set want_max = max_y + safe_dist + 10 %}

    # Clamping to the axis limits is still necessary, but it must not be silent: a clamp
    # means the requested clearance was NOT achieved, which is exactly the state that let a
    # gantry get tapped. Say so loudly rather than parking somewhere known to be unsafe.
    {% if want_max > axis_max_y %}
        { action_respond_info("PRINT_START WARNING: model reaches Y=" ~ max_y|round(2) ~
          ", so gantry0 wants Y=" ~ want_max|round(2) ~ " but the axis maximum is " ~
          axis_max_y|round(2) ~ ". Parking at the limit leaves " ~ (axis_max_y - max_y)|round(2) ~
          "mm of the " ~ safe_dist|round(1) ~ "mm clearance. COLLISION RISK -- move the model forward.") }
    {% endif %}
    # No matching warning for the front side, deliberately. gantry1 parks at park_min and
    # gantry0 does the printing there, but gantry0's own position_min (77.5) is a hard stop
    # it cannot cross -- gantry1 sits in front of it on the shared rail. With gantry1 parked
    # at its -1 limit the separation is a fixed 78.5mm no matter what the model does, so a
    # per-print warning would fire on almost every job and train us to ignore the rear one,
    # which is the side with no hardware stop and the side that actually got tapped.

    {% set park_min = [axis_min_y, want_min] | max %}
    {% set park_max = [axis_max_y, want_max] | min %}
    SET_GCODE_VARIABLE MACRO=_XPLORER_VARIABLES VARIABLE=park_min_y VALUE={park_min}
    SET_GCODE_VARIABLE MACRO=_XPLORER_VARIABLES VARIABLE=park_max_y VALUE={park_max}

    # --- Step 3: Tool preheats without changing active tool ---
    SET_DISPLAY_TEXT MSG='Heating Gantry 0: e0: { e_shared }°C & e1: { e1 }°C'
    {% if e_shared > 0 %} SET_HEATER_TEMPERATURE HEATER=extruder  TARGET={e_shared} {% endif %}
    {% if e1 > 0 %} SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={e1} {% endif %}
    {% if e_shared > 0 %} TEMPERATURE_WAIT   SENSOR=extruder  MINIMUM={e_shared}   MAXIMUM={e_shared+1} {% endif %}
    {% if e1 > 0 %} TEMPERATURE_WAIT   SENSOR=extruder1 MINIMUM={e1}   MAXIMUM={e1+1} {% endif %}

    SET_DISPLAY_TEXT MSG='Heating Gantry 1: e2: { e2 }°C & e3: { e3 }°C'
    {% if e2 > 0 %} SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET={e2} {% endif %}
    {% if e3 > 0 %} SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET={e3} {% endif %}
    {% if e2 > 0 %} TEMPERATURE_WAIT   SENSOR=extruder2 MINIMUM={e2}   MAXIMUM={e2+1} {% endif %}
    {% if e3 > 0 %} TEMPERATURE_WAIT   SENSOR=extruder3 MINIMUM={e3}   MAXIMUM={e3+1} {% endif %}

    # --- Optional chamber control ---
    {% if chamber > 0 and printer["gcode_macro SET_TEMPERATURE_FAN_TARGET"] is defined %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Electronics_fan TARGET={chamber}
    {% endif %}

    # --- Factory niceties (guarded) ---
    M400
    {% if printer.skew_correction is defined %}
        {% set skew_name = 'gantry0' if initial_tool < 2 else 'gantry1' %}
        SKEW_PROFILE LOAD={skew_name}
    {% endif %}
    {% if printer["gcode_macro save_last_file"] is defined %} save_last_file {% endif %}
    {% if printer["gcode_macro SAVE_VARIABLE"] is defined %}
        SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
        SAVE_VARIABLE VARIABLE=xy_resume VALUE=1
    {% endif %}
    G92 E0

    # --- Step 4: AFC initial-tool load BEFORE parallel mode activates ---
    # AFC tip-forms on the currently active toolhead. If COPY/MIRROR is
    # already active here (extruder1 synced with extruder via
    # SYNC_EXTRUDER_MOTION inside START_PRINTING_MODE), every tip-form
    # retract/extrude move propagates to extruder1, whose filament path
    # can't follow the manifold's sequence — Klipper shuts down with
    # "Unexpected error during CHANGE_TOOL". Drive AFC into the correct
    # lane while we're still in single-extruder mode. Idempotent: the
    # slicer's post-macro T{initial_extruder} sees the lane already
    # loaded and no-ops.
    T{initial_tool}
    G92 E0    # AFC tip-form / load may extrude — reset after

    # Apply printing mode
    START_PRINTING_MODE

    G4 P10000 # Allow nozzle to heat up a bit
    SET_DISPLAY_TEXT MSG='Now Printing'

    
[gcode_macro CANCEL_PRINT]
description: Cancel the current print safely, reset modes and prepare for next job

gcode:
    M118 CANCEL PRINT !

    _COMMON_PRINT_CLEANUP

    SDCARD_RESET_FILE

[gcode_macro END_PRINT]
description: End of print routine – shuts down heaters, disables COPY/MIRROR, resets toolheads

gcode:
    {% set svv = printer.save_variables.variables %}

    M118 Print Complete!

    _COMMON_PRINT_CLEANUP

    {% if svv.pwrendp == 0 %}
        END_PRINT_OFF
    {% endif %}


[gcode_macro _COMMON_PRINT_CLEANUP]
description: Helper macro to consolidate shared cleanup logic between CANCEL and END print
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    # General house keeping
    SET_SKEW CLEAR=1
    CLEAR_PAUSE

    # Retract filament and lift nozzle slightly
    G91
    G1 E-1 F1800        ; 1–2mm is typical for DD
    G1 Z0.5 F9000
    G90

    TURN_OFF_HEATERS

    # Turn off part cooling fans
    SET_FAN_SPEED FAN=Tool_0_partfan SPEED=0.0
    SET_FAN_SPEED FAN=Tool_1_partfan SPEED=0.0
    SET_FAN_SPEED FAN=Tool_2_partfan SPEED=0.0
    SET_FAN_SPEED FAN=Tool_3_partfan SPEED=0.0

    {% set axismax = printer.toolhead.axis_maximum %}
    {% set pos = printer.toolhead.position %}

    # Move toolhead away from print
    {% if pos.z <= (axismax.z - 10) %}
        G1 Z{ pos.z + 5 }
        G28 X
        G28 Y
    {% else %}
        G28 X
        G28 Y
    {% endif %}

    M117 PRESENT ITEM
    BED_MESH_CLEAR

    # ---- Disable COPY/MIRROR modes ----
    SAVE_VARIABLE VARIABLE=pmode VALUE=0
    M118 Copy/Mirror modes disabled

    # Unsync all extruders (restore independent motion)
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder  MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder2
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder3

    # Reset velocity limits and offsets
    SET_VELOCITY_LIMIT VELOCITY=300 ACCEL=5000
    G28 Z
    M400
    SET_GCODE_OFFSET X=0 Y=0 Z=0

    # Return all gantries and tools to rest positions
    SET_DUAL_CARRIAGE CARRIAGE=gantry1
    G90
    G1 Y{ xplorer.yrest2 } F5000

    SET_DUAL_CARRIAGE CARRIAGE=t0
    G90
    G1 X{ xplorer.xrest0 } F5000

    SET_DUAL_CARRIAGE CARRIAGE=t1
    G90
    G1 X{ xplorer.xrest1 } F5000

    SET_DUAL_CARRIAGE CARRIAGE=t2
    G90
    G1 X{ xplorer.xrest0 } F5000

    SET_DUAL_CARRIAGE CARRIAGE=t3
    G90
    G1 X{ xplorer.xrest1 } F5000

    # Make sure all carriages and gantries are in PRIMARY mode (ready for next print)
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY

    # Restore base settings and status
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    SAVE_VARIABLE VARIABLE=xy_resume VALUE=1
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0

    # Reset dynamic park positions back to stock extremes for next print
    SET_GCODE_VARIABLE MACRO=_XPLORER_VARIABLES VARIABLE=park_min_y VALUE=0
    SET_GCODE_VARIABLE MACRO=_XPLORER_VARIABLES VARIABLE=park_max_y VALUE={axismax.y}

