[gcode_macro PRINT_START]
description: Centralized start sequence with optional dual-extruder + chamber
# Usage:
#  PRINT_START BED=60 EXTRUDER=220 [EXTRUDER1=210] [CHAMBER=40] [TOOL=0|1]
gcode:
    {% set bed      = params.BED|default(0)|float %}
    {% set e0       = params.EXTRUDER|default(0)|float %}
    {% set e1       = params.EXTRUDER1|default(0)|float %}
    {% set chamber  = params.CHAMBER|default(0)|float %}
    {% set tool     = params.TOOL|default(0)|int %}
    {% set cfg      = printer.configfile.settings %}

    # --- Setup ---
    SET_GCODE_OFFSET Z=0                                   # Reset Z offset
    G28                                                    # Home all axes
    G90                                                    # Set to absolute positioning

    # --- Step 1: Fire up the grill ---
    {% if bed > 0 %}
	SET_DISPLAY_TEXT MSG='Heating Bed: { bed }°C'
        M140 S{bed}
        M190 S{bed}
    {% endif %}

    # --- Step 2: Start Nuclear Reactor ---
    # Heater to be done later

    # --- Step 3: Chasing Perfection ---
    TANGO_TIME
    G28 X

    # --- Step 4: Firing Up The Engines ---
    {% if e0 > 0 %} M109 S{e0} T0 {% endif %}
    {% if e1 > 0 %} M109 S{e1} T1 {% endif %}

    {% if e1 > 0 %}
        PRIME_TOOL1
    {% endif %}

    {% if e0 > 0 %}
        PRIME_TOOL0
    {% endif %}

    ; ---------------- Factory niceties (guarded) ----------------
    M400
    {% if printer.skew_correction is defined %} SKEW_PROFILE LOAD={skew_name} {% endif %}
    G28 X

    ; Restore factory behaviors if present
    {% if printer["gcode_macro save_last_file"] is defined %} save_last_file {% endif %}
    {% if printer["gcode_macro UPDATE_XY_POS"] is defined %} UPDATE_XY_POS {% endif %}
    {% if printer["gcode_macro printstart_audio"] is defined %} printstart_audio {% endif %}
    {% if printer["gcode_macro G31"] is defined %} G31 {% endif %}
    {% if printer["gcode_macro SET_TEMPERATURE_FAN_TARGET"] is defined %} SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Electronics_fan TARGET=45 {% endif %}
    {% if printer["gcode_macro SET_VELOCITY_LIMIT"] is defined %} SET_VELOCITY_LIMIT VELOCITY=350 ACCEL=15000 {% else %} SET_VELOCITY_LIMIT VELOCITY=350 ACCEL=15000 {% endif %}

    ; Persist/flags from factory start (guarded)
    {% if printer["gcode_macro SAVE_VARIABLE"] is defined %}
        SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
        SAVE_VARIABLE VARIABLE=xy_resume VALUE=1
        SAVE_VARIABLE VARIABLE=ttover_resume VALUE=0
    {% endif %}
    G92 E0

    ; ---------------- Select initial tool ----------------
    {% if initial_tool == 1 %}
        {% if printer["gcode_macro Tool1"] is defined %} Tool1 {% else %} T1 {% endif %}
    {% else %}
        {% if printer["gcode_macro Tool0"] is defined %} Tool0 {% else %} T0 {% endif %}
    {% endif %}

    ; ---------------- Start printing mode (optional) ----------------
    {% if printer["gcode_macro START_PRINTING_MODE"] is defined %} START_PRINTING_MODE {% endif %}
