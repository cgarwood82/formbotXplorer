#####################################################################
# MMU Tip Forming Logic
#####################################################################

[gcode_macro FORM_TIP_VARS]
description: Variables for tip forming logic
variable_ramming_volume:        22   # Volume in mm^3 to ram
variable_cooling_tube_length:   26   # Length of the cooling tube (mm)
variable_cooling_tube_position: 37   # Start of the cooling tube (mm)
variable_cooling_moves:         4    # Number of back/forth cooling moves
variable_unloading_speed_start: 80   # mm/s initial fast retract
variable_unloading_speed:       12   # mm/s slower retract into cooling zone
variable_initial_cooling_speed: 10   # mm/s initial cool move
variable_final_cooling_speed:   40   # mm/s final cool move
variable_final_eject_length:    70   # mm final retract to fully eject
variable_extruder_eject_speed:  30   # mm/s eject speed
gcode:
    # no gcode (vars only)

[gcode_macro FORM_TIP]
description: Standalone macro that mimics Superslicer process
gcode:
    {% set v = printer["gcode_macro FORM_TIP_VARS"] %}

    {% set final_eject = (params.FINAL_EJECT | default(v.final_eject_length)) | float %}
    {% set unloading_speed_start = v.unloading_speed_start | float %}
    {% set unloading_speed = v.unloading_speed | float %}
    {% set ramming_volume = v.ramming_volume | float %}
    {% set cooling_tube_length = v.cooling_tube_length | float %}
    {% set cooling_tube_position = v.cooling_tube_position | float %}
    {% set initial_cooling_speed = v.initial_cooling_speed | float %}
    {% set final_cooling_speed = v.final_cooling_speed | float %}
    {% set cooling_moves = v.cooling_moves | int %}
    {% set extruder_eject_speed = v.extruder_eject_speed | float %}

    SAVE_GCODE_STATE NAME=FORM_TIP_state

    G91                       ; relative positioning
    M83                       ; relative extrusion
    G92 E0

    # --- Ramming (optional) ---
    {% if ramming_volume > 0 %}
        {% set ratio = ramming_volume / 23.0 %}
        G1 E{0.5784 * ratio} F299
        G1 E{0.5834 * ratio} F302
        G1 E{0.5918 * ratio} F306
        G1 E{0.6169 * ratio} F319
        G1 E{0.3393 * ratio} F350
        G1 E{0.3363 * ratio} F350
        G1 E{0.7577 * ratio} F392
        G1 E{0.8382 * ratio} F434
        G1 E{0.7776 * ratio} F469
        G1 E{0.1293 * ratio} F469
        G1 E{0.9673 * ratio} F501
        G1 E{1.0176 * ratio} F527
        G1 E{0.5956 * ratio} F544
        G1 E{0.4555 * ratio} F544
        G1 E{1.0662 * ratio} F552
    {% endif %}

    # --- Retract into cooling zone ---
    {% set total_retract = (cooling_tube_position + cooling_tube_length - 15.0) %}
    G1 E-15 F{unloading_speed_start * 60.0}  ; SS-style initial snap retract

    {% if total_retract > 0 %}
        G1 E-{(0.7 * total_retract)|round(2)} F{unloading_speed * 60.0}
        G1 E-{(0.2 * total_retract)|round(2)} F{(0.5 * unloading_speed) * 60.0}
        G1 E-{(0.1 * total_retract)|round(2)} F{(0.3 * unloading_speed) * 60.0}
    {% endif %}

    # --- Cooling “wiggles” to freeze/separate the tip ---
    {% if cooling_moves > 0 %}
        {% set denom = (2 * cooling_moves - 1) %}
        {% set speed_inc = (final_cooling_speed - initial_cooling_speed) / (denom if denom > 0 else 1) %}

        {% for move in range(cooling_moves) %}
            {% set speed_fwd = initial_cooling_speed + speed_inc * (move * 2) %}
            {% set speed_back = speed_fwd + speed_inc %}
            G1 E{cooling_tube_length}  F{speed_fwd * 60.0}
            G1 E-{cooling_tube_length} F{speed_back * 60.0}
        {% endfor %}
    {% endif %}

    # --- Final eject ---
    {% if final_eject > 0 %}
        G92 E0
        G1 E-{final_eject} F{extruder_eject_speed * 60.0}
    {% endif %}

    RESTORE_GCODE_STATE NAME=FORM_TIP_state


#####################################################################
# Generic unload macro with toolchanger-friendly defaults
#####################################################################

[gcode_macro UNLOAD_TOOL]
description: Toolchanger-friendly unload (prefers ToolN macros if present)
variable_unload_temp: 200
variable_unload_distance: 70
gcode:
    SAVE_GCODE_STATE NAME=UNLOAD_TOOL_state

    {% set tool = (params.TOOL|default(-1))|int %}
    {% set extruder_param = params.EXTRUDER|default("") %}
    {% set unload_temp = (params.TEMP|default(printer["gcode_macro UNLOAD_TOOL"].unload_temp))|int %}
    {% set unload_dist = (params.DIST|default(printer["gcode_macro UNLOAD_TOOL"].unload_distance))|float %}

    # Decide which extruder name we’re targeting
    {% if extruder_param|length > 0 %}
        {% set extruder_name = extruder_param %}
    {% else %}
        {% if tool == -1 %}
            {% set extruder_name = printer.toolhead.extruder %}
        {% else %}
            {% set extruder_name = "extruder" ~ (tool|string if tool > 0 else "") %}
        {% endif %}
    {% endif %}

    # Prefer your existing IQEX tool macros (they usually handle parking + carriages + offsets)
    {% if tool >= 0 and ("gcode_macro Tool" ~ tool) in printer %}
        M118 Selecting Tool{tool} for unload...
        Tool{tool}
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER={extruder_name}
    {% endif %}

    M118 {extruder_name} unloading...
    M83
    G92 E0

    # Heat logic: if we can’t extrude OR we’re below min temp, set target + wait.
    {% set cur = printer[extruder_name].temperature|float %}
    {% set tgt = printer[extruder_name].target|float %}
    {% set can = printer[extruder_name].can_extrude %}

    {% if (not can) or (cur < unload_temp) %}
        SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET={unload_temp}
        TEMPERATURE_WAIT SENSOR={extruder_name} MINIMUM={unload_temp}
    {% elif tgt > 0 and cur < tgt %}
        # If user already had a hotter target, respect it and just wait to reach it.
        TEMPERATURE_WAIT SENSOR={extruder_name} MINIMUM={tgt|int}
    {% endif %}

    FORM_TIP FINAL_EJECT={unload_dist}
    M400
    M118 {extruder_name} unload complete!

    RESTORE_GCODE_STATE NAME=UNLOAD_TOOL_state


#####################################################################
# Convenience wrappers
#####################################################################

[gcode_macro UNLOAD_T0]
gcode: UNLOAD_TOOL TOOL=0

[gcode_macro UNLOAD_T1]
gcode: UNLOAD_TOOL TOOL=1

[gcode_macro UNLOAD_T2]
gcode: UNLOAD_TOOL TOOL=2

[gcode_macro UNLOAD_T3]
gcode: UNLOAD_TOOL TOOL=3
