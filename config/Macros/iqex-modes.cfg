####################################################################
# Multicolor IQEX print modes
#
# Two new print modes for multicolor printing on gantry0 (T0/T1
# alternating) with gantry1 copying or mirroring those movements
# (t2 shadows t0, t3 shadows t1).
#
# pmode values:
#   5 = MULTICOLOR_COPY01
#   6 = MULTICOLOR_MIRROR01
#
# See docs/superpowers/specs/2026-04-27-multicolor-iqex-modes-design.md
####################################################################

####################################################################
# Toolchange helpers — invoked by the Tool0/Tool1 dispatcher in
# overrides.cfg when pmode is 5 or 6
####################################################################

[gcode_macro _MC_TOOL0]
description: Multicolor T0-phase toolchange — t0 PRIMARY, t2 COPY, t1/t3 INACTIVE
gcode:
    {% set svv = printer.save_variables.variables %}
    _RETRACT_IF_PRINTING

    # gantry0: t0 active, t1 parked
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE

    # gantry1: t2 follows t0 in X, t3 parked
    # (gantry1 already in COPY or MIRROR from activation; not redoing)
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    # Per-phase shaper (guarded — defined keys only)
    {% if svv.pmode == 5 and svv.shaper_type_xmccpt0 is defined and
          svv.shaper_freq_xmccpt0 is defined and
          svv.shaper_type_ymccpt0 is defined and
          svv.shaper_freq_ymccpt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmccpt0} SHAPER_FREQ_X={svv.shaper_freq_xmccpt0} SHAPER_TYPE_Y={svv.shaper_type_ymccpt0} SHAPER_FREQ_Y={svv.shaper_freq_ymccpt0}
    {% elif svv.pmode == 6 and svv.shaper_type_xmcmrt0 is defined and
            svv.shaper_freq_xmcmrt0 is defined and
            svv.shaper_type_ymcmrt0 is defined and
            svv.shaper_freq_ymcmrt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmcmrt0} SHAPER_FREQ_X={svv.shaper_freq_xmcmrt0} SHAPER_TYPE_Y={svv.shaper_type_ymcmrt0} SHAPER_FREQ_Y={svv.shaper_freq_ymcmrt0}
    {% endif %}

    # Reset gcode offset to T0 reference
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

[gcode_macro _MC_TOOL1]
description: Multicolor T1-phase toolchange — t1 PRIMARY, t3 COPY, t0/t2 INACTIVE
gcode:
    {% set svv = printer.save_variables.variables %}
    _RETRACT_IF_PRINTING

    # gantry0: t1 active, t0 parked
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=INACTIVE

    # gantry1: t3 follows t1 in X, t2 parked
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=INACTIVE

    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder1

    # Per-phase shaper (guarded — defined keys only)
    {% if svv.pmode == 5 and svv.shaper_type_xmccpt1 is defined and
          svv.shaper_freq_xmccpt1 is defined and
          svv.shaper_type_ymccpt1 is defined and
          svv.shaper_freq_ymccpt1 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmccpt1} SHAPER_FREQ_X={svv.shaper_freq_xmccpt1} SHAPER_TYPE_Y={svv.shaper_type_ymccpt1} SHAPER_FREQ_Y={svv.shaper_freq_ymccpt1}
    {% elif svv.pmode == 6 and svv.shaper_type_xmcmrt1 is defined and
            svv.shaper_freq_xmcmrt1 is defined and
            svv.shaper_type_ymcmrt1 is defined and
            svv.shaper_freq_ymcmrt1 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmcmrt1} SHAPER_FREQ_X={svv.shaper_freq_xmcmrt1} SHAPER_TYPE_Y={svv.shaper_type_ymcmrt1} SHAPER_FREQ_Y={svv.shaper_freq_ymcmrt1}
    {% endif %}

    # T1 per-tool gcode offset (matches existing single-tool Tool1)
    SET_GCODE_OFFSET X={svv.x1offset} Y={svv.y1offset} Z={svv.z1offset} MOVE=0

####################################################################
# Mode activation macros
####################################################################

[gcode_macro ACTIVATE_MULTICOLOR_COPY_MODE01]
description: Multicolor copy mode — T0/T1 alternating on gantry0, t2/t3 follow on gantry1, gantry1=COPY of gantry0
gcode:
    M118 Activating MULTICOLOR COPY mode (T0/T1 alternate; T2/T3 copy)
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}

    # --- Seat each carriage at its starting X/Y ---
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    G1 X0 F{xplorer.sp_pmode}
    G1 Y300 F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    G1 X{xplorer.x_cop_idex}
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    G1 X{xplorer.x_cop_idex}
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    G1 Y{xplorer.y_cop_dg} F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    G1 X0

    # --- Final modes: T0 phase steady state ---
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=COPY

    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    SAVE_VARIABLE VARIABLE=pmode VALUE=5

    # --- T0-phase shaper (guarded) ---
    {% if svv.shaper_type_xmccpt0 is defined and
          svv.shaper_freq_xmccpt0 is defined and
          svv.shaper_type_ymccpt0 is defined and
          svv.shaper_freq_ymccpt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmccpt0} SHAPER_FREQ_X={svv.shaper_freq_xmccpt0} SHAPER_TYPE_Y={svv.shaper_type_ymccpt0} SHAPER_FREQ_Y={svv.shaper_freq_ymccpt0}
    {% endif %}

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

[gcode_macro ACTIVATE_MULTICOLOR_MIRROR_MODE01]
description: Multicolor mirror mode — T0/T1 alternating on gantry0, t2/t3 follow X, gantry1 Y-mirrors gantry0
gcode:
    M118 Activating MULTICOLOR MIRROR mode (T0/T1 alternate; T2/T3 Y-mirror)
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}

    # --- Seat each carriage at its starting X/Y ---
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    G1 X0 F{xplorer.sp_pmode}
    G1 Y300 F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    G1 X{xplorer.x_cop_idex}
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    G1 X{xplorer.x_cop_idex}
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    G1 Y{xplorer.y_mir_dg} F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    G1 X0

    # --- Final modes: T0 phase steady state ---
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=MIRROR

    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    SAVE_VARIABLE VARIABLE=pmode VALUE=6

    # --- T0-phase mirror shaper (guarded) ---
    {% if svv.shaper_type_xmcmrt0 is defined and
          svv.shaper_freq_xmcmrt0 is defined and
          svv.shaper_type_ymcmrt0 is defined and
          svv.shaper_freq_ymcmrt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmcmrt0} SHAPER_FREQ_X={svv.shaper_freq_xmcmrt0} SHAPER_TYPE_Y={svv.shaper_type_ymcmrt0} SHAPER_FREQ_Y={svv.shaper_freq_ymcmrt0}
    {% endif %}

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

####################################################################
# SET_PRINT_MODE wrapper — adds MULTICOLOR_COPY01 / MULTICOLOR_MIRROR01
# branches and delegates everything else to BASE_SET_PRINT_MODE.
####################################################################

[gcode_macro SET_PRINT_MODE]
rename_existing: BASE_SET_PRINT_MODE
description: Set print mode (PRIMARY, COPY01, MIRROR01, COPY0123, MIRROR0123, MULTICOLOR_COPY01, MULTICOLOR_MIRROR01)
gcode:
    {% set mode = (params.MODE|default("PRIMARY"))|upper %}
    {% if mode == "MULTICOLOR_COPY01" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=5
        M118 Print Mode: T0/T1 multicolor on gantry0; T2/T3 copy on gantry1
    {% elif mode == "MULTICOLOR_MIRROR01" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=6
        M118 Print Mode: T0/T1 multicolor on gantry0; T2/T3 mirror on gantry1
    {% else %}
        BASE_SET_PRINT_MODE MODE={mode}
    {% endif %}

####################################################################
# START_PRINTING_MODE wrapper — calls multicolor activation when
# pmode is 5 or 6, else delegates to BASE_START_PRINTING_MODE.
####################################################################

[gcode_macro START_PRINTING_MODE]
rename_existing: BASE_START_PRINTING_MODE
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.pmode == 5 %}
        M118 PRIMARY mode: MULTICOLOR_COPY01 active
        ACTIVATE_MULTICOLOR_COPY_MODE01
    {% elif svv.pmode == 6 %}
        M118 PRIMARY mode: MULTICOLOR_MIRROR01 active
        ACTIVATE_MULTICOLOR_MIRROR_MODE01
    {% else %}
        BASE_START_PRINTING_MODE
    {% endif %}

####################################################################
# Multicolor mode resonance calibration — runs both T0 and T1 phases
# back-to-back, saving per-phase shapers via the resonance shell
# scripts.
####################################################################

[gcode_macro RESONANCE_CALIBRATION_MULTICOLOR_Copy]
description: Calibrate input shapers for MULTICOLOR_COPY01 — both T0 and T1 phases
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    M118 Multicolor copy resonance calibration starting (T0 and T1 phases). May take several minutes.
    CHECK_HOME

    ACTIVATE_MULTICOLOR_COPY_MODE01
    G1 Z{xplorer.res_z} F2000

    # ---- Phase 1: T0 active, Tool0 accelerometer ----
    M118 Phase 1/2: T0 active
    TEST_RESONANCES AXIS=X POINT={xplorer.res_xmicp},{xplorer.res_y1micp4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonaces_x_mccpt0
    TEST_RESONANCES AXIS=Y POINT={xplorer.res_xmicp},{xplorer.res_y1micp4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonaces_y_mccpt0

    # ---- Switch to T1 phase via the same helper that runs in production ----
    _MC_TOOL1

    # ---- Phase 2: T1 active, Tool1 accelerometer ----
    M118 Phase 2/2: T1 active
    TEST_RESONANCES AXIS=X POINT={xplorer.res_xmicp},{xplorer.res_y1micp4e},{xplorer.res_z} ACCELEROMETER=Tool1
    RUN_SHELL_COMMAND CMD=resonaces_x_mccpt1
    TEST_RESONANCES AXIS=Y POINT={xplorer.res_xmicp},{xplorer.res_y1micp4e},{xplorer.res_z} ACCELEROMETER=Tool1
    RUN_SHELL_COMMAND CMD=resonaces_y_mccpt1

    # ---- Cleanup: restore all carriages PRIMARY, unsync extruders, rehome ----
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder2
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder3
    G28 X
    G28 Y
    M118 Multicolor Copy resonance test complete. Check PNG files in 03_Resonance_Measurements.
