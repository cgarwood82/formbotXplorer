####################################################################
# Multicolor IQEX print modes
#
# Two new print modes for multicolor printing on gantry0 (T0/T1
# alternating) with gantry1 copying or mirroring those movements
# (t2 shadows t0, t3 shadows t1).
#
# pmode values:
#   5 = MULTICOLOR_COPY01
#   6 = MULTICOLOR_MIRROR01
#
# See docs/superpowers/specs/2026-04-27-multicolor-iqex-modes-design.md
####################################################################

####################################################################
# Toolchange helpers — invoked by the Tool0/Tool1 dispatcher in
# overrides.cfg when pmode is 5 or 6
####################################################################

[gcode_macro _MC_TOOL0]
description: Multicolor T0-phase toolchange — t0 PRIMARY, t2 COPY, t1/t3 INACTIVE
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set saved_skew = printer.skew_correction.current_profile_name|default('') %}
    {% set t1_active = printer.dual_carriage.carriages["dual_carriage t1"]|default("INACTIVE") == "PRIMARY" %}
    _RETRACT_IF_PRINTING

    # If leaving t1/t3, park them (t1 PRIMARY, t3 in COPY) at X=421 so
    # they're out of t0's safe-distance window before the swap. Skipped
    # if t0/t2 are already active (idempotent re-call).
    {% if t1_active %}
        G1 X421 F{xplorer.sp_tch}
    {% endif %}

    # Disable skew during carriage swaps — see ACTIVATE_MULTICOLOR_*_MODE01.
    SET_SKEW CLEAR=1

    # Position t2 at its calibrated X-offset relative to t0 before SET COPY,
    # so the captured COPY offset bakes in t2's mounting calibration.
    # Sequence: t0 PRIMARY at X=0, then t2 PRIMARY at X=x2offset, then back
    # to t0 PRIMARY (toolhead resets to t0; t2 stays put as INACTIVE),
    # finally SET t2=COPY captures (t2.X - t0.X) = x2offset.
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    G1 X0 F{xplorer.sp_tch}
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    G1 X{svv.x2offset} F{xplorer.sp_tch}
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY

    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    {% if saved_skew %}
        SKEW_PROFILE LOAD={saved_skew}
    {% endif %}

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    # Per-phase shaper (guarded — defined keys only)
    {% if svv.pmode == 5 and svv.shaper_type_xmccpt0 is defined and
          svv.shaper_freq_xmccpt0 is defined and
          svv.shaper_type_ymccpt0 is defined and
          svv.shaper_freq_ymccpt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmccpt0} SHAPER_FREQ_X={svv.shaper_freq_xmccpt0} SHAPER_TYPE_Y={svv.shaper_type_ymccpt0} SHAPER_FREQ_Y={svv.shaper_freq_ymccpt0}
    {% elif svv.pmode == 6 and svv.shaper_type_xmcmrt0 is defined and
            svv.shaper_freq_xmcmrt0 is defined and
            svv.shaper_type_ymcmrt0 is defined and
            svv.shaper_freq_ymcmrt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmcmrt0} SHAPER_FREQ_X={svv.shaper_freq_xmcmrt0} SHAPER_TYPE_Y={svv.shaper_type_ymcmrt0} SHAPER_FREQ_Y={svv.shaper_freq_ymcmrt0}
    {% endif %}

    # Reset gcode offset to T0 reference
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

[gcode_macro _MC_TOOL1]
description: Multicolor T1-phase toolchange — t1 PRIMARY, t3 COPY, t0/t2 INACTIVE
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set saved_skew = printer.skew_correction.current_profile_name|default('') %}
    {% set t0_active = printer.dual_carriage.carriages["carriage t0"]|default("INACTIVE") == "PRIMARY" %}
    _RETRACT_IF_PRINTING

    # If leaving t0/t2, park them (t0 PRIMARY, t2 in COPY) at X=0 so
    # they're out of t1's safe-distance window before the swap. Skipped
    # if t1/t3 are already active (idempotent re-call).
    {% if t0_active %}
        G1 X0 F{xplorer.sp_tch}
    {% endif %}

    # Disable skew during carriage swaps — see ACTIVATE_MULTICOLOR_*_MODE01.
    SET_SKEW CLEAR=1

    # Position t3 at its calibrated X-offset relative to t1 before SET COPY,
    # so the captured COPY offset bakes in t3's mounting calibration relative
    # to t1. Target: t3.X - t1.X = (x3offset - x1offset). Both park at 421.
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    G1 X421 F{xplorer.sp_tch}
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    G1 X{421 + svv.x3offset - svv.x1offset} F{xplorer.sp_tch}
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY

    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=INACTIVE

    {% if saved_skew %}
        SKEW_PROFILE LOAD={saved_skew}
    {% endif %}

    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder1

    # Per-phase shaper (guarded — defined keys only)
    {% if svv.pmode == 5 and svv.shaper_type_xmccpt1 is defined and
          svv.shaper_freq_xmccpt1 is defined and
          svv.shaper_type_ymccpt1 is defined and
          svv.shaper_freq_ymccpt1 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmccpt1} SHAPER_FREQ_X={svv.shaper_freq_xmccpt1} SHAPER_TYPE_Y={svv.shaper_type_ymccpt1} SHAPER_FREQ_Y={svv.shaper_freq_ymccpt1}
    {% elif svv.pmode == 6 and svv.shaper_type_xmcmrt1 is defined and
            svv.shaper_freq_xmcmrt1 is defined and
            svv.shaper_type_ymcmrt1 is defined and
            svv.shaper_freq_ymcmrt1 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmcmrt1} SHAPER_FREQ_X={svv.shaper_freq_xmcmrt1} SHAPER_TYPE_Y={svv.shaper_type_ymcmrt1} SHAPER_FREQ_Y={svv.shaper_freq_ymcmrt1}
    {% endif %}

    # T1 per-tool gcode offset (matches existing single-tool Tool1)
    SET_GCODE_OFFSET X={svv.x1offset} Y={svv.y1offset} Z={svv.z1offset} MOVE=0

####################################################################
# Mode activation macros
####################################################################

[gcode_macro ACTIVATE_MULTICOLOR_COPY_MODE01]
description: Multicolor copy mode — T0/T1 alternating on gantry0, t2/t3 follow on gantry1, gantry1=COPY of gantry0
gcode:
    M118 Activating MULTICOLOR_COPY01: T2 follows T0, T3 follows T1; gantry1 = COPY of gantry0
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set saved_skew = printer.skew_correction.current_profile_name|default('') %}

    # --- Disable skew during carriage juggling ---
    # SET_DUAL_CARRIAGE swaps call toolhead.set_position, which resets
    # gcode_move.last_position from the (skew-transformed) physical pos.
    # If skew is active, the next G1 then re-skews that already-skewed
    # value, drifting the X target further each pass and eventually
    # crossing position_min. Restore the saved profile after the swaps.
    SET_SKEW CLEAR=1

    # --- Seat the active pair at their starting X/Y ---
    # T1 and T3 are intentionally NOT moved here — they stay parked at
    # wherever they currently are (typically X=421 from G28). Moving them
    # would put them over the bed and shrink the safe-distance limit on T0.
    # T2 is parked at X=x2offset (not 0) so the SET t2=COPY below captures
    # offset = x2offset, baking in t2's calibrated mounting offset.
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    G1 X0 F{xplorer.sp_pmode}
    G1 Y342.5 F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    G1 Y{xplorer.y_cop_dg} F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    G1 X{svv.x2offset}

    # --- Final modes: T0 phase steady state ---
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=COPY

    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    # --- Restore skew profile (if one was loaded) ---
    {% if saved_skew %}
        SKEW_PROFILE LOAD={saved_skew}
    {% endif %}

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    SAVE_VARIABLE VARIABLE=pmode VALUE=5

    # --- T0-phase shaper (guarded) ---
    {% if svv.shaper_type_xmccpt0 is defined and
          svv.shaper_freq_xmccpt0 is defined and
          svv.shaper_type_ymccpt0 is defined and
          svv.shaper_freq_ymccpt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmccpt0} SHAPER_FREQ_X={svv.shaper_freq_xmccpt0} SHAPER_TYPE_Y={svv.shaper_type_ymccpt0} SHAPER_FREQ_Y={svv.shaper_freq_ymccpt0}
    {% endif %}

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

[gcode_macro ACTIVATE_MULTICOLOR_MIRROR_MODE01]
description: Multicolor mirror mode — T0/T1 alternating on gantry0, t2/t3 follow X, gantry1 Y-mirrors gantry0
gcode:
    M118 Activating MULTICOLOR_MIRROR01: T2 follows T0, T3 follows T1; gantry1 = Y-MIRROR of gantry0
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set saved_skew = printer.skew_correction.current_profile_name|default('') %}

    # --- Disable skew during carriage juggling ---
    # SET_DUAL_CARRIAGE swaps call toolhead.set_position, which resets
    # gcode_move.last_position from the (skew-transformed) physical pos.
    # If skew is active, the next G1 then re-skews that already-skewed
    # value, drifting the X target further each pass and eventually
    # crossing position_min. Restore the saved profile after the swaps.
    SET_SKEW CLEAR=1

    # --- Seat the active pair at their starting X/Y ---
    # T1 and T3 are intentionally NOT moved here — they stay parked at
    # wherever they currently are (typically X=421 from G28). Moving them
    # would put them over the bed and shrink the safe-distance limit on T0.
    # T2 is parked at X=x2offset (not 0) so the SET t2=COPY below captures
    # offset = x2offset, baking in t2's calibrated mounting offset.
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    G1 X0 F{xplorer.sp_pmode}
    G1 Y342.5 F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    G1 Y{xplorer.y_mir_dg} F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    G1 X{svv.x2offset}

    # --- Final modes: T0 phase steady state ---
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=MIRROR

    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    # --- Restore skew profile (if one was loaded) ---
    {% if saved_skew %}
        SKEW_PROFILE LOAD={saved_skew}
    {% endif %}

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    SAVE_VARIABLE VARIABLE=pmode VALUE=6

    # --- T0-phase mirror shaper (guarded) ---
    {% if svv.shaper_type_xmcmrt0 is defined and
          svv.shaper_freq_xmcmrt0 is defined and
          svv.shaper_type_ymcmrt0 is defined and
          svv.shaper_freq_ymcmrt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xmcmrt0} SHAPER_FREQ_X={svv.shaper_freq_xmcmrt0} SHAPER_TYPE_Y={svv.shaper_type_ymcmrt0} SHAPER_FREQ_Y={svv.shaper_freq_ymcmrt0}
    {% endif %}

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

####################################################################
# SET_PRINT_MODE — single source of truth for all print modes.
####################################################################

[gcode_macro SET_PRINT_MODE]
description: Set print mode (PRIMARY, COPY01, MIRROR01, COPY0123, MIRROR0123, MULTICOLOR_COPY01, MULTICOLOR_MIRROR01)
gcode:
    {% set mode = (params.MODE|default("PRIMARY"))|upper %}
    {% set allowed = ["PRIMARY","COPY01","MIRROR01","COPY0123","MIRROR0123","MULTICOLOR_COPY01","MULTICOLOR_MIRROR01"] %}

    {% if mode not in allowed %}
        M118 Invalid Print Mode! Available: PRIMARY, COPY01, MIRROR01, COPY0123, MIRROR0123, MULTICOLOR_COPY01, MULTICOLOR_MIRROR01.
    {% elif mode == "PRIMARY" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=0
        M118 Print Mode: PRIMARY
    {% elif mode == "COPY01" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=1
        M118 Print Mode: T1 COPY T0
    {% elif mode == "MIRROR01" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=2
        M118 Print Mode: T1 MIRROR T0
    {% elif mode == "COPY0123" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=3
        M118 Print Mode: T1, T2, T3 COPY T0
    {% elif mode == "MIRROR0123" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=4
        M118 Print Mode:  T2, T3 MIRROR T0, T1
    {% elif mode == "MULTICOLOR_COPY01" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=5
        M118 Print Mode: MULTICOLOR_COPY01 (T2 follows T0, T3 follows T1; gantry1 = COPY of gantry0)
    {% elif mode == "MULTICOLOR_MIRROR01" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=6
        M118 Print Mode: MULTICOLOR_MIRROR01 (T2 follows T0, T3 follows T1; gantry1 = Y-MIRROR of gantry0)
    {% endif %}

####################################################################
# START_PRINTING_MODE — single source of truth for activating the
# print mode at the start of a print, based on the saved pmode.
####################################################################

[gcode_macro START_PRINTING_MODE]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.pmode == 0 %}
        M118 Starting PRIMARY mode
        # Single-tool mode — no activation macro needed
    {% elif svv.pmode == 1 %}
        ACTIVATE_COPY_MODE01
    {% elif svv.pmode == 2 %}
        ACTIVATE_MIRROR_MODE01
    {% elif svv.pmode == 3 %}
        ACTIVATE_COPY_MODE0123
    {% elif svv.pmode == 4 %}
        ACTIVATE_MIRROR_MODE0123
    {% elif svv.pmode == 5 %}
        ACTIVATE_MULTICOLOR_COPY_MODE01
    {% elif svv.pmode == 6 %}
        ACTIVATE_MULTICOLOR_MIRROR_MODE01
    {% endif %}

####################################################################
# Multicolor mode resonance calibration — runs both T0 and T1 phases
# back-to-back, saving per-phase shapers via the resonance shell
# scripts.
####################################################################

[gcode_macro _MC_CALIBRATE_PARK_INACTIVES]
description: Helper — park t1 and t3 at their normal rest X (419) without disturbing t0/t2.
             Used by the multicolor calibration macros to set up phase 1.
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    # Park t1 at its normal rest X
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    G1 X419 F{xplorer.sp_tch}
    # Park t3 at its normal rest X
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    G1 X419 F{xplorer.sp_tch}
    # Park t2 at its normal rest X (will become COPY of t0)
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    G1 X0 F{xplorer.sp_tch}
    # Activate t0 at its rest X
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    G1 X0 F{xplorer.sp_tch}

[gcode_macro RESONANCE_CALIBRATION_MULTICOLOR_Copy]
description: Calibrate input shapers for MULTICOLOR_COPY01 — both T0 and T1 phases.
             Active pair tests at X=ximex4e (200) on both gantry centers (y0imex4e/y1imex4e).
             Inactive tools remain at their normal park positions throughout.
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    M118 Multicolor copy resonance calibration starting (T0 and T1 phases). May take several minutes.
    CHECK_HOME

    # ---- Park all 4 carriages at their rest X positions ----
    # t1 -> 419, t3 -> 419, t2 -> 0, t0 -> 0 (active)
    _MC_CALIBRATE_PARK_INACTIVES

    # ---- Position gantries: gantry0 at y0imex4e, gantry1 at y1imex4e ----
    # gantry1's seating Y here determines the COPY offset (y1imex4e - y0imex4e).
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    G1 Y{xplorer.y0imex4e} F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    G1 Y{xplorer.y1imex4e} F{xplorer.sp_tchy}

    # ---- Final modes: T0 phase steady state (t0/t2 active in COPY, t1/t3 INACTIVE) ----
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    G1 Z{xplorer.res_z} F2000

    # ---- Phase 1: T0+T2 active at (ximex4e, y0imex4e); t1/t3 parked at X=419 ----
    M118 Phase 1/2: T0 active
    TEST_RESONANCES AXIS=X POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonaces_x_mccpt0
    TEST_RESONANCES AXIS=Y POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonaces_y_mccpt0

    # ---- Re-park t0 (and t2 in COPY) at X=0 before phase 2 swap ----
    # Both at offset 0, so G1 X=0 takes both back to their rest cleanly.
    G1 X0 F{xplorer.sp_tch}

    # ---- Swap to phase 2: t1+t3 active, t0/t2 inactivate at X=0 (their rest) ----
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=COPY

    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder1

    # ---- Phase 2: T1+T3 active at (ximex4e, y0imex4e); t0/t2 parked at X=0 ----
    M118 Phase 2/2: T1 active
    TEST_RESONANCES AXIS=X POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool1
    RUN_SHELL_COMMAND CMD=resonaces_x_mccpt1
    TEST_RESONANCES AXIS=Y POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool1
    RUN_SHELL_COMMAND CMD=resonaces_y_mccpt1

    # ---- Re-park t1 (and t3 in COPY) at X=419 before cleanup ----
    G1 X419 F{xplorer.sp_tch}

    # ---- Cleanup: restore all carriages PRIMARY, unsync extruders, rehome ----
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder2
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder3
    G28 X
    G28 Y
    M118 Multicolor Copy resonance test complete. Check PNG files in 03_Resonance_Measurements.

[gcode_macro RESONANCE_CALIBRATION_MULTICOLOR_Mirror]
description: Calibrate input shapers for MULTICOLOR_MIRROR01 — both T0 and T1 phases.
             Active pair tests at X=ximex4e (200) on both gantry centers (y0imex4e/y1imex4e).
             Inactive tools remain at their normal park positions throughout.
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    M118 Multicolor mirror resonance calibration starting (T0 and T1 phases). May take several minutes.
    CHECK_HOME

    # ---- Park all 4 carriages at their rest X positions ----
    _MC_CALIBRATE_PARK_INACTIVES

    # ---- Position gantries: gantry0 at y0imex4e, gantry1 at y1imex4e ----
    # gantry1's seating Y here determines the MIRROR offset.
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    G1 Y{xplorer.y0imex4e} F{xplorer.sp_tchy}
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    G1 Y{xplorer.y1imex4e} F{xplorer.sp_tchy}

    # ---- Final modes: T0 phase steady state, gantry1=MIRROR ----
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=MIRROR
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=COPY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=INACTIVE

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

    G1 Z{xplorer.res_z} F2000

    # ---- Phase 1: T0+T2 active at (ximex4e, y0imex4e); t1/t3 parked at X=419 ----
    M118 Phase 1/2: T0 active
    TEST_RESONANCES AXIS=X POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonaces_x_mcmrt0
    TEST_RESONANCES AXIS=Y POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonaces_y_mcmrt0

    # ---- Re-park t0 (and t2 in COPY) at X=0 before phase 2 swap ----
    G1 X0 F{xplorer.sp_tch}

    # ---- Swap to phase 2 ----
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=COPY

    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder1

    # ---- Phase 2: T1+T3 active at (ximex4e, y0imex4e); t0/t2 parked at X=0 ----
    M118 Phase 2/2: T1 active
    TEST_RESONANCES AXIS=X POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool1
    RUN_SHELL_COMMAND CMD=resonaces_x_mcmrt1
    TEST_RESONANCES AXIS=Y POINT={xplorer.ximex4e},{xplorer.y0imex4e},{xplorer.res_z} ACCELEROMETER=Tool1
    RUN_SHELL_COMMAND CMD=resonaces_y_mcmrt1

    # ---- Re-park t1 (and t3 in COPY) at X=419 before cleanup ----
    G1 X419 F{xplorer.sp_tch}

    # ---- Cleanup ----
    SET_DUAL_CARRIAGE CARRIAGE=t0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t2 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=t3 MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder2
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder3
    G28 X
    G28 Y
    M118 Multicolor Mirror resonance test complete. Check PNG files in 03_Resonance_Measurements.
