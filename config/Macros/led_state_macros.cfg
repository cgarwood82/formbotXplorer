################################################
# LED STATE MACROS
################################################

[gcode_macro LED_ERROR_ALL]
description: Turn all tool LEDs into global error state
gcode:
    SET_LED_EFFECT EFFECT=tools_error REPLACE=1


# All tools idle (printer stopped / not printing)
[gcode_macro LED_ALL_IDLE]
description: Set all toolhead LEDs to their idle effect
gcode:
    SET_LED_EFFECT EFFECT=tool0_idle REPLACE=1
    SET_LED_EFFECT EFFECT=tool1_idle REPLACE=1
    SET_LED_EFFECT EFFECT=tool2_idle REPLACE=1
    SET_LED_EFFECT EFFECT=tool3_idle REPLACE=1


# Core: one active tool in worklight, all others idle
[gcode_macro LED_SET_ACTIVE_TOOL]
description: Set one tool to worklight, others to idle. Usage: LED_SET_ACTIVE_TOOL TOOL=0..3
gcode:
    {% set t = params.TOOL|default(-1)|int %}

    # Tool 0
    {% if t == 0 %}
      SET_LED_EFFECT EFFECT=tool0_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool0_idle REPLACE=1
    {% endif %}

    # Tool 1
    {% if t == 1 %}
      SET_LED_EFFECT EFFECT=tool1_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool1_idle REPLACE=1
    {% endif %}

    # Tool 2
    {% if t == 2 %}
      SET_LED_EFFECT EFFECT=tool2_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool2_idle REPLACE=1
    {% endif %}

    # Tool 3
    {% if t == 3 %}
      SET_LED_EFFECT EFFECT=tool3_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool3_idle REPLACE=1
    {% endif %}


# Helper: infer active tool from printer.toolhead.extruder
# (nice for generic macros where you don't pass TOOL explicitly)
[gcode_macro LED_ACTIVE_TOOL_FROM_EXTRUDER]
description: Set LEDs based on current active extruder
gcode:
    {% set e = printer.toolhead.extruder %}
    {% if e == "extruder" %}
      LED_SET_ACTIVE_TOOL TOOL=0
    {% elif e == "extruder1" %}
      LED_SET_ACTIVE_TOOL TOOL=1
    {% elif e == "extruder2" %}
      LED_SET_ACTIVE_TOOL TOOL=2
    {% elif e == "extruder3" %}
      LED_SET_ACTIVE_TOOL TOOL=3
    {% else %}
      LED_ALL_IDLE
    {% endif %}


# Bed heating state: use your bed-heating effect across all tools
[gcode_macro LED_BED_HEATING_ON]
description: Show bed heating status on all toolhead LEDs
gcode:
    SET_LED_EFFECT EFFECT=bed_heating_all_tools REPLACE=1


[gcode_macro LED_BED_HEATING_OFF]
description: Stop bed heating LEDs (does not change per-tool states)
gcode:
    SET_LED_EFFECT EFFECT=bed_heating_all_tools STOP=1


[gcode_macro LED_SET_ACTIVE_TOOLS]
description: Set multiple tools to worklight, others to idle. Usage: LED_SET_ACTIVE_TOOLS T0=0/1 T1=0/1 T2=0/1 T3=0/1
gcode:
    {% set t0 = params.T0|default(0)|int %}
    {% set t1 = params.T1|default(0)|int %}
    {% set t2 = params.T2|default(0)|int %}
    {% set t3 = params.T3|default(0)|int %}

    # Tool 0
    {% if t0 %}
      SET_LED_EFFECT EFFECT=tool0_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool0_idle REPLACE=1
    {% endif %}

    # Tool 1
    {% if t1 %}
      SET_LED_EFFECT EFFECT=tool1_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool1_idle REPLACE=1
    {% endif %}

    # Tool 2
    {% if t2 %}
      SET_LED_EFFECT EFFECT=tool2_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool2_idle REPLACE=1
    {% endif %}

    # Tool 3
    {% if t3 %}
      SET_LED_EFFECT EFFECT=tool3_worklight REPLACE=1
    {% else %}
      SET_LED_EFFECT EFFECT=tool3_idle REPLACE=1
    {% endif %}
