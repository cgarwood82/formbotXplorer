################################################
# GLOBAL ERROR / HOMING EFFECTS (ALL TOOLS)
################################################

# All tools flash white on homing events
[led_effect tools_homing]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
    neopixel:Tool_1_rgb
    neopixel:Tool_2_rgb
    neopixel:Tool_3_rgb
endstops: x, y, z
layers:
    homing 1 0 top (1.0, 1.0, 1.0)

# All tools red strobe on error / cancel
[led_effect tools_error]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
    neopixel:Tool_1_rgb
    neopixel:Tool_2_rgb
    neopixel:Tool_3_rgb
layers:
    strobe 3 1.5 top (1.0, 0.0, 0.0)

################################################
# OPTIONAL MACROS FOR EASY CONTROL
################################################

# Per-tool macros (T0–T3) – call these from toolchange / print macros

[gcode_macro LED_TOOL0_IDLE]
gcode:
    SET_LED_EFFECT EFFECT=tool0_idle REPLACE=1

