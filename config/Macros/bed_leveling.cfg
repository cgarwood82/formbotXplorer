#####################################################################
##                            Bed Leveling and Calibration Macros
#####################################################################

[gcode_macro _PREPARE_FOR_Z_TILT]
gcode:
    # Ensure we’re homed and in a safe state on the rear gantry with T0
    CHECK_HOME
    G90
    SET_DUAL_CARRIAGE CARRIAGE=gantry0                 ; rear Y gantry
    SET_DUAL_CARRIAGE CARRIAGE=t0                      ; rear X carriage (Tool0)
    SET_GCODE_OFFSET X=0 Y=0 Z=0                       ; clear any XY/Z offsets
    Tool0                                              ; make sure T0 is the active extruder
    # Safe Z and Y clamp for rear gantry soft-limit (>= 140)
    {% if printer.gcode_move.position.z < 10 %}
        G1 Z10 F3000
    {% endif %}
    {% if printer.toolhead.position.y < 140 %}
        G1 Y140 F6000
    {% endif %}

[gcode_macro Z_TILT_ADJUST]     # IDM/Cartographer optimized 3Z leveling macro
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT         # Save current user state
    _PREPARE_FOR_Z_TILT                        # Force rear gantry + T0, clear offsets, safe Z/Y
    BED_MESH_CLEAR                             # Clear bed mesh
    {% if not printer.z_tilt.applied %}
      _Z_TILT_ADJUST horizontal_move_z=10 retry_tolerance=1   # coarse pass
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=2          # fine pass
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT       # Restore user state after adjustment

####################################################################################
##                               Probe Calibration Macro
####################################################################################
[gcode_macro PROBECALIBRATE]
# Defines a G-code macro for probe calibration
gcode:
    G28                          # Home all axes
    Tool0                        # Switch to Tool0
    G0 X200 Y200 Z1 F3600        # Fast move to X150 Y150 Z1 at 3600 mm/min
    CARTOGRAPHER_TOUCH_CALIBRATE # Start probe calibration

####################################################################################
##                              Tango Time!
####################################################################################
[gcode_macro TANGO_TIME]
description: Level the bed and find z offset
gcode:
    {% set e0 = params.EXTRUDER|default(0)|float %}
    {% set e1 = params.EXTRUDER1|default(0)|float %}
    {% set e2 = params.EXTRUDER2|default(0)|float %}
    {% set e3 = params.EXTRUDER3|default(0)|float %}

    SET_DISPLAY_TEXT MSG='Heating Hot End to 150C'
    M109 S{150} T0

    SET_DISPLAY_TEXT MSG='Cleaning Nozzle...'              # Display nozzle cleaning message
    Brush_Tool0

    SET_DISPLAY_TEXT MSG='Leveling...'                     # Display leveling message
    Z_TILT_ADJUST

    #SET_DISPLAY_TEXT MSG='Bed Mesh Calibration...'         # Display mesh calibration message
    #BED_MESH_CALIBRATE ADAPTIVE=1                          # Perform bed mesh calibration

    # --- Mesh strategy (robust for 4 tools) ---
    # Rules:
    #   - If ONLY Tool0 (e0) > 0 → adaptive mesh
    #   - If Tool0 not heated OR any other tool heated → load 'default'
    #   - If no tools heated → raise error
    # --- Mesh strategy (Tool0-only => adaptive; else => default; none => error)

    {% set hot0 = 1 if e0 > 0 else 0 %}
    {% set hot1 = 1 if e1 > 0 else 0 %}
    {% set hot2 = 1 if e2 > 0 else 0 %}
    {% set hot3 = 1 if e3 > 0 else 0 %}
    {% set heated_tools = hot0 + hot1 + hot2 + hot3 %}

    BED_MESH_CLEAR
    {% if heated_tools == 0 %}
        {action_raise_error("No heated extruders detected — set at least one EXTRUDER temperature.")}
    {% elif hot0 == 1 and heated_tools == 1 %}
        SET_DISPLAY_TEXT MSG="Mesh: adaptive (T0 only)"
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=10
    {% else %}
        SET_DISPLAY_TEXT MSG="Mesh: loading 'default'"
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    BED_MESH_CLEAR
    {% if heated_tools == 0 %}
        {action_raise_error("No heated extruders detected — set at least one EXTRUDER temperature.")}
    {% elif hot0 == 1 and heated_tools == 1 %}
        SET_DISPLAY_TEXT MSG="Mesh: adaptive (T0 only)"
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=10
    {% else %}
        SET_DISPLAY_TEXT MSG="Mesh: loading 'default'"
        BED_MESH_PROFILE LOAD=default
    {% endif %}


    SET_DISPLAY_TEXT MSG='Calibrating Z Offset'            # Display Z offset calibration message
    CARTOGRAPHER_TOUCH_HOME                                # Calibrate Z offset
