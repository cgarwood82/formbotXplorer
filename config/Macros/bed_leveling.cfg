#####################################################################
##                            Bed Leveling and Calibration Macros
#####################################################################

##################################
# Z Stepper Align
##################################

[z_tilt]
z_positions: -60.1, -3.9            # Z Belt position relativ to origin  (left Z Motor)
               210, 537.5           # Z1 Belt position relativ to origin (back Z Motor)
              481.1, -3.9           # Z2 Belt position relativ to origin (right Z Motor)


points: 80, 140     # probing point left Z Motor (raised to respect rear gantry Y>=140)
        210, 390    # probing point back Z Motor
        340, 140    # probing point right Z Motor (raised to respect rear gantry Y>=140)

speed: 200
horizontal_move_z: 7
retries: 15
retry_tolerance: 0.035

##################################
# Bed Mesh
##################################

[bed_mesh]
zero_reference_position: 200, 200
speed: 200
horizontal_move_z: 2
mesh_min: 40, 121
mesh_max: 338, 380
probe_count: 20, 20
mesh_pps: 0, 0
fade_end: 10
fade_target: 0

#[gcode_macro BED_MESH_CALIBRATE]
#gcode:
#      Tool0
#      BASE_BED_MESH_CALIBRATE

####################################################################################
##                              Tango Time!
####################################################################################
[gcode_macro TANGO_TIME]
description: Level bed, prepare mesh and Z offset (IDEX/IQEX safe, rear-Y>=135)
# Params:
#  EXTRUDER = AFC active flag (1/0)
#  EXTRUDER1..3 = temps for extruder1..3 (non-AFC toolheads)

gcode:
    {% set afc = params.EXTRUDER|default(0)|float %}
    {% set e1  = params.EXTRUDER1|default(0)|float %}
    {% set e2  = params.EXTRUDER2|default(0)|float %}
    {% set e3  = params.EXTRUDER3|default(0)|float %}

    SET_DISPLAY_TEXT MSG='Heating Hot End to 150C'
    M109 S150 T0

    SET_DISPLAY_TEXT MSG='Cleaning Nozzle...'
    Brush_Tool0

    SET_DISPLAY_TEXT MSG='Z Tilt Adjust...'
    Z_TILT_ADJUST

    # Mesh strategy: if ONLY T0 is heated (>0), do adaptive; otherwise load default
    {% set hot0 = 1 if afc > 0 else 0 %}
    {% set hot1 = 1 if e1 > 0 else 0 %}
    {% set hot2 = 1 if e2 > 0 else 0 %}
    {% set hot3 = 1 if e3 > 0 else 0 %}
    {% set heated_tools = hot0 + hot1 + hot2 + hot3 %} 

    BED_MESH_CLEAR
    {% if heated_tools == 0 %}
        { action_raise_error("No tools detected (AFC flag is 0 and extruder1-3 temps are 0).") }
    {% elif hot0 == 1 and heated_tools == 1 %}
        SET_DISPLAY_TEXT MSG="Mesh: adaptive (AFC only)"
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=10
    {% else %}
        SET_DISPLAY_TEXT MSG="Mesh: loading 'default' (multi-tool)"
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    SET_DISPLAY_TEXT MSG='Calibrating Z Offset'
    CARTOGRAPHER_TOUCH_HOME

    # Cool down AFC hotend after cleaning/probing
    SET_DISPLAY_TEXT MSG="Cooling AFC hotend"
    M104 S0 T0
