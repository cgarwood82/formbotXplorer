####################################################################
# Z-only tool offset calibration
#
# Measures each tool's nozzle height against T0 with [tools_calibrate]
# and saves ONLY z1offset / z2offset / z3offset. The X/Y offsets were
# calibrated with a camera and are deliberately never written here --
# they are read back and printed alongside the probe's own X/Y result
# as a cross-check, nothing more.
#
# Why the Z result is trustworthy without disturbing X/Y:
# TOOL_CALIBRATE_TOOL_OFFSET returns (location - sensor_location) in
# TOOLHEAD coordinates, so it is unaffected by whatever SET_GCODE_OFFSET
# is live. The dz it reports is an absolute physical difference from T0,
# not a residual.
#
# The LIVE gcode offset is still zeroed at every tool activation below,
# and that is not optional. Tool0-3 apply the saved offsets, and this
# choreography moves to exact axis limits -- G1 Y392 against gantry0
# position_max 392 -- so any live offset puts the move out of range.
# (Measured the hard way: y1offset 0.107578 made it Y392.108 and aborted
# the run.) This is what ZERO_TOOL_OFFSETS really bought the original
# macro; the measurement hygiene was incidental.
#
# SET_GCODE_OFFSET only touches the live transform, never variables.cfg,
# so the camera-calibrated x*/y* survive untouched and are re-applied by
# the next ordinary Tool0-3 call.
#
# Deliberately unlike AUTO_CALIBRATE_tool_offsets:
#   - never calls ZERO_TOOL_OFFSETS, so the stored X/Y are never
#     destroyed. Each tool's Z is written straight after that tool's own
#     probe succeeds, so an abort partway through leaves every other
#     tool's stored value intact rather than zeroed.
#
# TOOL=<1|2|3>  probe only that tool. The carriage choreography below is
#               still executed IN FULL for every tool -- only the heat,
#               brush and probe are gated -- because the T2 and T3
#               approaches depend on the state the previous tool left
#               behind. Skipping moves would mean inventing new clearance
#               paths; skipping only the slow parts does not.
# DRY_RUN=1     probe and report, save nothing.
####################################################################

[gcode_macro CALIBRATE_TOOL_Z_OFFSETS]
description: Measure and save per-tool Z offsets only; leaves camera-calibrated X/Y untouched
gcode:
    {% set svv  = printer.save_variables.variables %}
    {% set only = params.TOOL|default(0)|int %}
    {% set dry  = params.DRY_RUN|default(0)|int %}

    {% if only not in [0, 1, 2, 3] %}
        { action_raise_error("TOOL must be 1, 2 or 3, or omitted for all three") }
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("Refusing to calibrate while a print is active") }
    {% endif %}

    {% set do1 = only in [0, 1] %}
    {% set do2 = only in [0, 2] %}
    {% set do3 = only in [0, 3] %}

    M118 === Z-only tool offset calibration ===
    M118 The nozzles MUST BE PERFECTLY CLEAN !!!
    {% if dry %}
    M118 DRY RUN -- probing normally, saving nothing
    {% endif %}

    # --- Home, level, clean T0, establish the Z reference ---
    # CHECK_HOME must come first: Tool0 issues G1 moves (and PARK_extruder1/2/3,
    # which do too), so invoking it on an unhomed machine aborts the whole macro
    # with "Must home axis first". Klipper is always unhomed right after the
    # restart that loads this file, which is exactly when it gets run.
    # (AUTO_CALIBRATE_tool_offsets has the same latent bug; it survives only
    # because it is normally run on an already-homed machine.)
    CHECK_HOME
    Tool0
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={svv.tprobe}
    G28
    Z_TILT_ADJUST
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={svv.tprobe} TIMEOUT=300
    Brush_Tool0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150 TIMEOUT=300
    G90
    G0 X176.5 Y200 F8000
    CARTOGRAPHER_TOUCH_HOME

    # --- Heat and brush only the tools we are actually going to probe ---
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={svv.tprobe}
    {% if do1 %}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={svv.tprobe}
    {% endif %}
    {% if do2 %}
    SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET={svv.tprobe}
    {% endif %}
    {% if do3 %}
    SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET={svv.tprobe}
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={svv.tprobe} TIMEOUT=300
    {% if do1 %}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={svv.tprobe} TIMEOUT=300
    Brush_Tool1
    {% endif %}
    {% if do2 %}
    TEMPERATURE_WAIT SENSOR=extruder2 MINIMUM={svv.tprobe} TIMEOUT=300
    Brush_Tool2
    {% endif %}
    {% if do3 %}
    TEMPERATURE_WAIT SENSOR=extruder3 MINIMUM={svv.tprobe} TIMEOUT=300
    Brush_Tool3
    {% endif %}

    # --- Baseline: T0 locates the sensor (gantry0/t0). Never saved: T0 IS zero.
    Tool0
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0

    # --- Tool1 on gantry0/t1 ---
    Tool1
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    {% if do1 %}
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_CALIBRATE_TOOL_OFFSET
    _TZC_SAVE TOOL=1 DRY_RUN={dry}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    PARK_extruder1

    # --- Tool2 on gantry1/t2 ---
    G90
    SET_DUAL_CARRIAGE CARRIAGE=gantry0
    SET_DUAL_CARRIAGE CARRIAGE=t1
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G1 X340 Y392 F9000
    ACTIVATE_EXTRUDER EXTRUDER=extruder2
    SET_DUAL_CARRIAGE CARRIAGE=gantry1
    SET_DUAL_CARRIAGE CARRIAGE=t2
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    {% if do2 %}
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_CALIBRATE_TOOL_OFFSET
    _TZC_SAVE TOOL=2 DRY_RUN={dry}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET=0
    G1 Y200 F9000
    G1 X1 F9000
    SET_DUAL_CARRIAGE CARRIAGE=gantry0
    SET_DUAL_CARRIAGE CARRIAGE=t1
    G1 X419 F9000

    # --- Tool3 on gantry1/t3 ---
    G90
    SET_DUAL_CARRIAGE CARRIAGE=gantry0
    SET_DUAL_CARRIAGE CARRIAGE=t0
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G1 X80 Y392 F9000
    ACTIVATE_EXTRUDER EXTRUDER=extruder3
    SET_DUAL_CARRIAGE CARRIAGE=gantry1
    SET_DUAL_CARRIAGE CARRIAGE=t3
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    {% if do3 %}
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_CALIBRATE_TOOL_OFFSET
    _TZC_SAVE TOOL=3 DRY_RUN={dry}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET=0
    G1 Y58 F9000
    G1 X419 F9000
    SET_DUAL_CARRIAGE CARRIAGE=gantry0
    SET_DUAL_CARRIAGE CARRIAGE=t0
    G1 X1 F9000

    M118 === Z-only calibration complete ===


####################################################################
# Save one tool's Z offset from the most recent probe.
#
# This has to be its own macro rather than inline above: a gcode_macro
# template is rendered once, when the command is dispatched, so an inline
# read of printer.tools_calibrate.last_result would capture the value from
# BEFORE the probe ran. Invoking a separate macro after the probe forces a
# fresh render. Same reason _save_offsets_t1 exists.
####################################################################

[gcode_macro _TZC_SAVE]
description: Write one tool's z<n>offset from tools_calibrate; never writes X/Y
gcode:
    {% set tool = params.TOOL|int %}
    {% set dry  = params.DRY_RUN|default(0)|int %}
    {% set svv  = printer.save_variables.variables %}
    {% set r    = printer["tools_calibrate"].last_result %}

    {% if not r %}
        { action_raise_error("No tools_calibrate result for T" ~ tool ~
                             " -- TOOL_CALIBRATE_TOOL_OFFSET did not run") }
    {% else %}
        {% set dx    = r[0]|round(6) %}
        {% set dy    = r[1]|round(6) %}
        {% set z_new = (r[2] * -1)|round(6) %}
        {% set z_old = svv["z" ~ tool ~ "offset"]|default(0)|float %}
        {% set x_cam = svv["x" ~ tool ~ "offset"]|default(0)|float %}
        {% set y_cam = svv["y" ~ tool ~ "offset"]|default(0)|float %}

        M118 T{tool} Z: {z_old} -> {z_new}  (change {(z_new - z_old)|round(6)})
        M118 T{tool} XY cross-check, NOT saved: dX {dx} vs stored {x_cam} (delta {(dx - x_cam)|round(6)}) / dY {dy} vs stored {y_cam} (delta {(dy - y_cam)|round(6)})
        {% if dry %}
        M118 T{tool} DRY RUN -- z{tool}offset left at {z_old}
        {% else %}
        SAVE_VARIABLE VARIABLE=z{tool}offset VALUE={z_new}
        {% endif %}
    {% endif %}
