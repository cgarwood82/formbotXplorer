[gcode_macro PRIME_TWO_LINES_A2B]
description: Prime two lines from X_A -> X_B then back (Y clamped >= 130)
gcode:
    {% set x_a       = params.X_A|default(100.1)|float %}
    {% set x_b       = params.X_B|default(280.1)|float %}
    {% set y0        = params.Y|default(130.0)|float %}
    {% set z_h       = params.Z|default(0.38)|float %}
    {% set e1        = params.E1|default(15)|float %}
    {% set e2        = params.E2|default(30)|float %}
    {% set f_travel  = params.F_TRAVEL|default(5000)|int %}
    {% set f_extrude = params.F_EXTRUDE|default(1500)|int %}
    {% set lift      = params.LIFT|default(2.0)|float %}
    {% if y0 < 130.0 %}{% set y0 = 130.0 %}{% endif %}
    {% set y1 = y0 + 0.4 %}

    G1 X{x_a} Y{y0} Z{z_h} F{f_travel}
    G1 X{x_b} Y{y0} Z{z_h} F{f_extrude} E{e1}
    G1 X{x_b} Y{y1} Z{z_h} F{f_travel}
    G1 X{x_a} Y{y1} Z{z_h} F{f_extrude} E{e2}
    G92 E0
    G1 Z{lift} F2000

[gcode_macro PRIME_TWO_LINES_B2A]
description: Prime two lines from X_B -> X_A then back (Y clamped >= 130)
gcode:
    {% set x_a       = params.X_A|default(100.1)|float %}
    {% set x_b       = params.X_B|default(280.1)|float %}
    {% set y0        = params.Y|default(130.0)|float %}
    {% set z_h       = params.Z|default(0.38)|float %}
    {% set e1        = params.E1|default(15)|float %}
    {% set e2        = params.E2|default(30)|float %}
    {% set f_travel  = params.F_TRAVEL|default(5000)|int %}
    {% set f_extrude = params.F_EXTRUDE|default(1500)|int %}
    {% set lift      = params.LIFT|default(2.0)|float %}
    {% if y0 < 130.0 %}{% set y0 = 130.0 %}{% endif %}
    {% set y1 = y0 + 0.4 %}

    G1 X{x_b} Y{y0} Z{z_h} F{f_travel}
    G1 X{x_a} Y{y0} Z{z_h} F{f_extrude} E{e1}
    G1 X{x_a} Y{y1} Z{z_h} F{f_travel}
    G1 X{x_b} Y{y1} Z{z_h} F{f_extrude} E{e2}
    G92 E0
    G1 Z{lift} F2000

[gcode_macro PRIME_TOOL0]
description: Select Tool0, optional brush, then prime two lines A→B
gcode:
    {% set y = params.Y|default(130.0)|float %}
    {% if printer["gcode_macro Tool0"] is defined %} Tool0 {% else %} T0 {% endif %}
    {% if printer["gcode_macro brush_Tool0"] is defined %} brush_Tool0 {% endif %}
    PRIME_TWO_LINES_A2B Y={y} {rawparams}

[gcode_macro PRIME_TOOL1]
description: Select Tool1, optional brush, then prime two lines B→A
gcode:
    {% set y = params.Y|default(131.0)|float %}
    {% if printer["gcode_macro Tool1"] is defined %} Tool1 {% else %} T1 {% endif %}
    {% if printer["gcode_macro brush_Tool1"] is defined %} brush_Tool1 {% endif %}
    PRIME_TWO_LINES_B2A Y={y} {rawparams}