# Buffer 0
[output_pin _T1 Feed Button]
pin:!hexa:PC15 # Replace with the pin you are using
debounce_delay:2.0
value:0

[output_pin _T1 Retract Button]
pin:!hexa:PC14 # Replace with the pin you are using
debounce_delay:2.0
value:0


[gcode_macro T1 Unload]  ## Buffer Feeding
gcode:
    SET_PIN PIN=_T1_Retract_Button VALUE=0
    SET_PIN PIN=_Feed_Button VALUE=1
    G4 P10000 # 10 seconds
    SET_PIN PIN=_Feed_Button VALUE=0

[gcode_macro T1 Load]  ## Buffer Feeding
gcode:
    SET_PIN PIN=_T1_Feed_Button VALUE=0
    SET_PIN PIN=_Retract_Button VALUE=1
    G4 P10000 # 10 seconds
    SET_PIN PIN=_Retract_Button VALUE=0
