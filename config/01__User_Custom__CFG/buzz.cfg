#####################################################################
# xy_buzz_test.cfg — Standalone buzz for X & Y motors
# Enable this include ONLY when testing; comment out your prod X/Y sections.
#####################################################################

# ---------------- X MOTORS ----------------
[manual_stepper buzz_x]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 32
rotation_distance: 31.93

[manual_stepper buzz_x1]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 32
rotation_distance: 31.93

[manual_stepper buzz_x2]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 32
rotation_distance: 31.93

[manual_stepper buzz_x3]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 32
rotation_distance: 31.93

# ---------------- Y MOTORS ----------------
[manual_stepper buzz_y]
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
microsteps: 32
rotation_distance: 39.90

[manual_stepper buzz_y1]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 32
rotation_distance: 39.90

[manual_stepper buzz_y2]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PB11
microsteps: 32
rotation_distance: 39.90

[manual_stepper buzz_y3]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 32
rotation_distance: 39.90

#####################################################################
# Helper macros
#####################################################################

[gcode_macro BUZZ_STEPPER]
description: Buzz a manual stepper by moving +DISTANCE and -DISTANCE REPEATS times
# Usage: BUZZ_STEPPER STEPPER=buzz_x DISTANCE=5 SPEED=20 REPEATS=2
gcode:
  {% set name    = params.STEPPER|default("buzz_x") %}
  {% set dist    = (params.DISTANCE|default(5.0))|float %}
  {% set speed   = (params.SPEED|default(20.0))|float %}
  {% set repeats = (params.REPEATS|default(2))|int %}
  { action_respond_info("Buzzing " ~ name ~ " (+/-" ~ dist|string ~ "mm @ " ~ speed|string ~ "mm/s, " ~ repeats|string ~ "x)") }
  MANUAL_STEPPER STEPPER={name} ENABLE=1
  {% for i in range(repeats) %}
    MANUAL_STEPPER STEPPER={name} MOVE={dist} SPEED={speed}
    G4 P200
    MANUAL_STEPPER STEPPER={name} MOVE={-dist} SPEED={speed}
    G4 P200
  {% endfor %}
  MANUAL_STEPPER STEPPER={name} ENABLE=0

[gcode_macro BUZZ_X_ALL]
description: Buzz all X motors in sequence
gcode:
  BUZZ_STEPPER STEPPER=buzz_x  DISTANCE=5 SPEED=20 REPEATS=2
  G4 P300
  BUZZ_STEPPER STEPPER=buzz_x1 DISTANCE=5 SPEED=20 REPEATS=2
  G4 P300
  BUZZ_STEPPER STEPPER=buzz_x2 DISTANCE=5 SPEED=20 REPEATS=2
  G4 P300
  BUZZ_STEPPER STEPPER=buzz_x3 DISTANCE=5 SPEED=20 REPEATS=2

[gcode_macro BUZZ_Y_ALL]
description: Buzz all Y motors in sequence
gcode:
  BUZZ_STEPPER STEPPER=buzz_y  DISTANCE=5 SPEED=20 REPEATS=2
  G4 P300
  BUZZ_STEPPER STEPPER=buzz_y1 DISTANCE=5 SPEED=20 REPEATS=2
  G4 P300
  BUZZ_STEPPER STEPPER=buzz_y2 DISTANCE=5 SPEED=20 REPEATS=2
  G4 P300
  BUZZ_STEPPER STEPPER=buzz_y3 DISTANCE=5 SPEED=20 REPEATS=2

# Energize / release all quickly during wiring checks
[gcode_macro ENERGIZE_ALL]
gcode:
  {% set S = ["buzz_x","buzz_x1","buzz_x2","buzz_x3","buzz_y","buzz_y1","buzz_y2","buzz_y3"] %}
  {% for n in S %}
    MANUAL_STEPPER STEPPER={n} ENABLE=1
  {% endfor %}

[gcode_macro RELEASE_ALL]
gcode:
  {% set S = ["buzz_x","buzz_x1","buzz_x2","buzz_x3","buzz_y","buzz_y1","buzz_y2","buzz_y3"] %}
  {% for n in S %}
    MANUAL_STEPPER STEPPER={n} ENABLE=0
  {% endfor %}
