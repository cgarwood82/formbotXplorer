#--=================================================================================-
#------- AFC purge gate ------------------------------------------------------------
#--=================================================================================-
# AFC exposes purging as a single global switch (`poop:` in AFC/AFC.cfg). There is no
# per-toolhead way to disable it: AFC.py TOOL_LOAD() calls do_poop_kick_wipe()
# unconditionally on every genuine lane-to-tool load. (`enable_standalone_purge` in
# AFC_Hardware.cfg gates a different, narrower path and does NOT cover this.)
#
# _AFC_POOP_VARS purge_loc_xy is 75, 366.5 -- a single point only T0 can reach:
#   T0  X  -1..342, gantry0  -> reachable
#   T1  X  76..422, gantry0  -> X=75 is 1mm outside its travel
#   T2  X  -1..342, gantry1  -> no purge location exists on gantry1 at all
#   T3  X  76..422, gantry1  -> same
#
# Without this gate, a tool change into T1/T2/T3 sends the toolhead to that point,
# Klipper rejects the move ("Move out of range: 75.225 366.611 ...") and AFC catches
# the error and pauses the print mid-job.
#
# This macro is wired in as `poop_cmd:` in AFC/AFC.cfg so AFC's purge requests route
# through here. Requests for a toolhead in no_purge_extruders are dropped; everything
# else is forwarded to the stock AFC_POOP macro untouched.
#
# Upstream tracking: ArmoredTurtle/AFC-Klipper-Add-On -- feature request for a
# per-extruder purge-disable option. Remove this file once that lands.

[gcode_macro _AFC_POOP_GATED]
description: Routes AFC purge requests, skipping toolheads with no reachable purge location
variable_no_purge_extruders: ['extruder1', 'extruder2', 'extruder3']
gcode:
  {% set ext = params.EXTRUDER | default('') %}
  {% if ext in printer['gcode_macro _AFC_POOP_GATED'].no_purge_extruders %}
    RESPOND TYPE=command MSG="AFC_Poop: skipping purge for {ext} (no reachable purge location for this toolhead)"
  {% else %}
    AFC_POOP {rawparams}
  {% endif %}
