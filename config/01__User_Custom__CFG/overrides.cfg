[output_pin caselight]
value: 0
gcode:


########################################################
# Overrides for Iqex configs to incorporate LED effects
########################################################

[delayed_gcode led_idle_startup]
initial_duration: 2
gcode:
    LED_ALL_IDLE

########################################################
# Tool activation wrappers (Tool0..Tool3)
########################################################

[gcode_macro Tool0]
rename_existing: BASE_Tool0
gcode:
    BASE_Tool0
    # LEDs: Tool0 active
    LED_SET_ACTIVE_TOOL TOOL=0

[gcode_macro Tool1]
rename_existing: Tool1_BASE
gcode:
    Tool1_BASE
    # LEDs: Tool1 active
    LED_SET_ACTIVE_TOOL TOOL=1

[gcode_macro Tool2]
rename_existing: Tool2_BASE
gcode:
    Tool2_BASE
    # LEDs: Tool2 active
    LED_SET_ACTIVE_TOOL TOOL=2

[gcode_macro Tool3]
rename_existing: Tool3_BASE
gcode:
    Tool3_BASE
    # LEDs: Tool3 active
    LED_SET_ACTIVE_TOOL TOOL=3

########################################################
# Print mode / IDEX / IQEX mode wrappers
########################################################

# COPY mode T0/T1
[gcode_macro ACTIVATE_COPY_MODE01]
rename_existing: ACTIVATE_COPY_MODE01_BASE
gcode:
    ACTIVATE_COPY_MODE01_BASE
    # LEDs: T0 + T1 active
    LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=0 T3=0

# MIRROR mode T0/T1
[gcode_macro ACTIVATE_MIRROR_MODE01]
rename_existing: ACTIVATE_MIRROR_MODE01_BASE
gcode:
    ACTIVATE_MIRROR_MODE01_BASE
    # LEDs: T0 + T1 active
    LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=0 T3=0

# COPY mode T0/T1/T2/T3
[gcode_macro ACTIVATE_COPY_MODE0123]
rename_existing: ACTIVATE_COPY_MODE0123_BASE
gcode:
    ACTIVATE_COPY_MODE0123_BASE
    # LEDs: all four tools active
    LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=1 T3=1

# COPY mode T0/T1/T2 only
[gcode_macro ACTIVATE_COPY_MODE012]
rename_existing: ACTIVATE_COPY_MODE012_BASE
gcode:
    ACTIVATE_COPY_MODE012_BASE
    # LEDs: T0, T1, T2 active; T3 idle
    LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=1 T3=0

# MIRROR mode IQEX T0 T1 / T2 T3
[gcode_macro ACTIVATE_MIRROR_MODE0123]
rename_existing: ACTIVATE_MIRROR_MODE0123_BASE
gcode:
    ACTIVATE_MIRROR_MODE0123_BASE
    # LEDs: all four tools active
    LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=1 T3=1

########################################################
# Primary mode wrapper
########################################################

[gcode_macro ACTIVATE_PRIMARY_MODE]
rename_existing: ACTIVATE_PRIMARY_MODE_BASE
gcode:
    ACTIVATE_PRIMARY_MODE_BASE
    # LEDs: back to primary mode – default to Tool0 active
    LED_SET_ACTIVE_TOOL TOOL=0

########################################################
# START_PRINT / END_PRINT / CANCEL_PRINT wrappers
########################################################

[gcode_macro START_PRINT]
rename_existing: START_PRINT_BASE
gcode:
    START_PRINT_BASE
    # After start logic: set LEDs to match mode
    {% set svv = printer.save_variables.variables %}
    {% set pmode = svv.pmode|default(0)|int %}

    {% if pmode == 0 %}
        # Primary single-tool mode – assume T0
        LED_SET_ACTIVE_TOOL TOOL=0
    {% elif pmode == 1 %}
        # T1 COPY T0
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=0 T3=0
    {% elif pmode == 2 %}
        # T1 MIRROR T0
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=0 T3=0
    {% elif pmode == 3 %}
        # T1, T2, T3 COPY T0
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=1 T3=1
    {% elif pmode == 4 %}
        # T2,T3 MIRROR T0,T1
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=1 T3=1
    {% else %}
        LED_ALL_IDLE
    {% endif %}

[gcode_macro END_PRINT]
rename_existing: END_PRINT_BASE
gcode:
    END_PRINT_BASE
    # LEDs: job finished
    LED_ALL_IDLE


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT_NOLED
gcode:
    BASE_CANCEL_PRINT_NOLED
    LED_ALL_IDLE


######################################################################
# PAUSE – LED wrapper
######################################################################

[gcode_macro PAUSE]
rename_existing: PAUSE_NOLED
description: Pause print + LED state
gcode:
    # Run original pause sequence
    PAUSE_NOLED

    # LEDs: printer is paused / safe
    LED_ALL_IDLE

######################################################################
# RESUME – LED wrapper
######################################################################

[gcode_macro RESUME]
rename_existing: RESUME_NOLED
description: Resume print + re-apply mode LEDs
gcode:
    # Run original resume sequence
    RESUME_NOLED

    # Re-apply LED state based on print mode
    {% set svv = printer.save_variables.variables %}
    {% set pmode = svv.pmode|default(0)|int %}

    {% if pmode == 0 %}
        # PRIMARY mode – single tool printing:
        # Pick the current active extruder and light that tool; others idle.
        {% if printer.toolhead.extruder == "extruder" %}
            LED_SET_ACTIVE_TOOL TOOL=0
        {% elif printer.toolhead.extruder == "extruder1" %}
            LED_SET_ACTIVE_TOOL TOOL=1
        {% elif printer.toolhead.extruder == "extruder2" %}
            LED_SET_ACTIVE_TOOL TOOL=2
        {% elif printer.toolhead.extruder == "extruder3" %}
            LED_SET_ACTIVE_TOOL TOOL=3
        {% else %}
            # Fallback if something weird: assume Tool0
            LED_SET_ACTIVE_TOOL TOOL=0
        {% endif %}

    {% elif pmode == 1 %}
        # T1 COPY T0
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=0 T3=0

    {% elif pmode == 2 %}
        # T1 MIRROR T0
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=0 T3=0

    {% elif pmode == 3 %}
        # T1,T2,T3 COPY T0
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=1 T3=1

    {% elif pmode == 4 %}
        # T2,T3 MIRROR T0,T1
        LED_SET_ACTIVE_TOOLS T0=1 T1=1 T2=1 T3=1

    {% else %}
        # Unknown / future mode – fall back to idle to avoid nonsense
        LED_ALL_IDLE
    {% endif %}
