##################################
# Z Axis -- 3 Steppers
##################################

#   BACK of the printer   #
#                         #
#           Z1            #
#                         #
#       Z       Z2        #
#                         #
#   FRONT of the printer  #

#  Stepper Left  ###########

[stepper_z]
step_pin: skr:PB0
dir_pin: !skr:PC5
enable_pin: !skr:PB1
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16
endstop_pin: ~PF1
position_endstop: 401
position_max: 401
position_min: -3
homing_speed: 20
homing_retract_dist: 10.0
homing_retract_speed: 10
second_homing_speed: 5

[tmc2209 stepper_z]
uart_pin: skr:PC11
uart_address: 0
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999

#  Stepper Back  ############

[stepper_z1]
step_pin: skr:PB10
dir_pin: skr:PB2
enable_pin: !skr:PB11
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16
endstop_pin: ~PF0

[tmc2209 stepper_z1]
uart_pin: skr:PC11
uart_address: 1
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999

#  Stepper Right  #########

[stepper_z2]
step_pin: skr:PB13
dir_pin: skr:PB12
enable_pin: !skr:PB14
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16
endstop_pin: ~PC15

[tmc2209 stepper_z2]
uart_pin: skr:PC11
uart_address: 2
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999