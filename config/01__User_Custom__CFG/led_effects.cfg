##############################################
# led_effects.cfg
#
# Effects for toolhead RGBs 0–3
# Assumes:
#   [neopixel Tool_0_rgb] ... [neopixel Tool_3_rgb]
#   [extruder], [extruder1], [extruder2], [extruder3]
##############################################


################################################
# TOOL 0 - Tool_0_rgb
################################################

# Idle breathing (soft teal)
[led_effect tool0_idle]
autostart: true
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
layers:
    breathing 3 0 top (0.0, 0.4, 0.6)

# Heating color ramp (blue → green → red)
[led_effect tool0_heating]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
heater: extruder
layers:
    temperature 20 260 top (0.0, 0.0, 1.0),(0.0, 1.0, 0.0),(1.0, 0.0, 0.0)

# Print progress indicator (red → orange → green)
[led_effect tool0_progress]
autostart: false
frame_rate: 10
leds:
    neopixel:Tool_0_rgb
layers:
    progress 2 0 top (1.0, 0.0, 0.0),(1.0, 0.5, 0.0),(0.0, 1.0, 0.0)

# Error strobe (red flash)
[led_effect tool0_error]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
layers:
    strobe 3 1.5 top (1.0, 0.0, 0.0)

# Work light (static white)
[led_effect tool0_worklight]
autostart: false
frame_rate: 5
leds:
    neopixel:Tool_0_rgb
layers:
    static 1 0 top (1.0, 1.0, 1.0)



