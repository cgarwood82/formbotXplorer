################################################
# GLOBAL ERROR / HOMING EFFECTS (ALL TOOLS)
################################################

# All tools flash white on homing events
[led_effect tools_homing]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
    neopixel:Tool_1_rgb
    neopixel:Tool_2_rgb
    neopixel:Tool_3_rgb
endstops: x, y, z
layers:
    homing 1 0 top (1.0, 1.0, 1.0)

# All tools red strobe on error / cancel
[led_effect tools_error]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
    neopixel:Tool_1_rgb
    neopixel:Tool_2_rgb
    neopixel:Tool_3_rgb
layers:
    strobe 3 1.5 top (1.0, 0.0, 0.0)

################################################
# BED HEATING EFFECT ON ALL TOOLHEADS
# (Blue → Green → Orange → White)
################################################

[led_effect bed_heating_all_tools]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
    neopixel:Tool_1_rgb
    neopixel:Tool_2_rgb
    neopixel:Tool_3_rgb
heater: heater_bed
layers:
    # temperature MIN MAX placement colors...
    # 20°C → blue, 60°C → green, 90°C → orange, 110°C → white
    temperature 20 110 top (0.0, 0.0, 1.0),(0.0, 1.0, 0.0),(1.0, 0.5, 0.0),(1.0, 1.0, 1.0)

################################################
# Tool 0 filament-status effects
################################################

# Filament runout / change requested
[led_effect tool0_filament_runout]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
layers:
    strobe 3 1.5 top (1.0, 0.3, 0.0)   # bright orange/red strobe

# Filament loading in progress
[led_effect tool0_filament_loading]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
layers:
    comet 1 2 top (0.0, 1.0, 0.0),(0.0, 0.3, 0.0)   # green comet forward

# Filament unloading in progress
[led_effect tool0_filament_unloading]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
layers:
    comet -1 2 top (0.3, 0.6, 1.0),(0.0, 0.1, 0.3)  # blue comet backwards

# Filament tangle / “bad” condition
[led_effect tool0_filament_tangle]
autostart: false
frame_rate: 24
leds:
    neopixel:Tool_0_rgb
layers:
    twinkle 30 0.25 top (1.0, 0.0, 0.0),(1.0, 0.5, 0.0)  # angry red/orange twinkle
