[gcode_macro PRIME_TWO_LINES]
description: Draw two parallel prime lines with Y safety clamp
# Usage:
#  PRIME_TWO_LINES [X_A=100.1] [X_B=280.1] [Y=130.0] [Z=0.38]
#                  [E1=15] [E2=30] [F_TRAVEL=5000] [F_EXTRUDE=1500] [LIFT=2.0]
#                  [REVERSE=0|1]   ; 0=A→B then B→A (Tool0 style), 1=B→A then A→B (Tool1 style)
gcode:
    {% set x_a       = params.X_A|default(100.1)|float %}
    {% set x_b       = params.X_B|default(280.1)|float %}
    {% set y_req     = params.Y|default(130.0)|float %}
    {% set z_h       = params.Z|default(0.38)|float %}
    {% set e1        = params.E1|default(15)|float %}
    {% set e2        = params.E2|default(30)|float %}
    {% set f_travel  = params.F_TRAVEL|default(5000)|int %}
    {% set f_extrude = params.F_EXTRUDE|default(1500)|int %}
    {% set lift      = params.LIFT|default(2.0)|float %}
    {% set reverse   = params.REVERSE|default(0)|int %}
    {% set min_y     = 130.0 %}
    {% set y0        = y_req if y_req >= min_y else min_y %}
    {% set y1        = y0 + 0.4 %}

    ; Optional warning if we had to clamp
    {% if y_req < min_y %}
        RESPOND MSG="PRIME_TWO_LINES: Y clamped from {{y_req}} to {{y0}} for safety."
    {% endif %}

    ; Determine first/second line directions
    {% if reverse == 1 %}
        {% set sx1, ex1 = x_b, x_a %}
        {% set sx2, ex2 = x_a, x_b %}
    {% else %}
        {% set sx1, ex1 = x_a, x_b %}
        {% set sx2, ex2 = x_b, x_a %}
    {% endif %}

    ; Line 1
    G1 X{sx1} Y{y0} Z{z_h} F{f_travel}
    G1 X{ex1} Y{y0} Z{z_h} F{f_extrude} E{e1}
    ; Step over
    G1 X{ex1} Y{y1} Z{z_h} F{f_travel}
    ; Line 2
    G1 X{sx2} Y{y1} Z{z_h} F{f_extrude} E{e2}
    ; Reset & lift
    G92 E0
    G1 Z{lift} F2000

[gcode_macro PRIME_TOOL0]
description: Select Tool0, optional brush, then prime two lines (A→B then back)
# Params: Y, Z, etc. are forwarded to PRIME_TWO_LINES. Default Y=130.0
gcode:
    {% set y = params.Y|default(130.0)|float %}
    {% if printer["gcode_macro Tool0"] is defined %} Tool0 {% else %} T0 {% endif %}
    {% if printer["gcode_macro brush_Tool0"] is defined %} brush_Tool0 {% endif %}
    PRIME_TWO_LINES Y={y} REVERSE=0 {rawparams}

[gcode_macro PRIME_TOOL1]
description: Select Tool1, optional brush, then prime two lines (B→A then back)
# Params: Y, Z, etc. are forwarded to PRIME_TWO_LINES. Default Y=131.0 (offset)
gcode:
    {% set y = params.Y|default(131.0)|float %}
    {% if printer["gcode_macro Tool1"] is defined %} Tool1 {% else %} T1 {% endif %}
    {% if printer["gcode_macro brush_Tool1"] is defined %} brush_Tool1 {% endif %}
    PRIME_TWO_LINES Y={y} REVERSE=1 {rawparams}
