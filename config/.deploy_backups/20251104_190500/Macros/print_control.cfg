[gcode_macro PRINT_START]
description: Centralized start sequence with optional dual-extruder + chamber
# Usage:
#  PRINT_START BED=60 EXTRUDER=220 [EXTRUDER1=210] [CHAMBER=40] [TOOL=0|1]
gcode:
    {% set bed      = params.BED|default(0)|float %}
    {% set e0       = params.EXTRUDER|default(0)|float %}
    {% set e1       = params.EXTRUDER1|default(0)|float %}
    {% set chamber  = params.CHAMBER|default(0)|float %}
    {% set tool     = params.TOOL|default(0)|int %}
    {% set cfg      = printer.configfile.settings %}

    # --- Setup ---
    SET_GCODE_OFFSET Z=0                                   # Reset Z offset
    G28                                                    # Home all axes
    G90                                                    # Set to absolute positioning

    # --- Step 1: Fire up the grill ---
    SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}°C"     # Display bed heating message
    M190 S{target_bed}                                     # Wait for bed to reach target temperature

    # --- Step 2: Start Nuclear Reactor ---
    {% if target_chamber > 0 %}
        SET_DISPLAY_TEXT MSG="Starting Chamber Heater: {target_chamber}°C"
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target_chamber}
    {% endif %}

    # --- Step 3: Chasing Perfection ---
    TANGO_TIME

    # --- Step 4: Firing Up The Engines ---
    {% if e0 > 0 %} M109 S{e0} T0 {% endif %}
    {% if e1 > 0 %} M109 S{e1} T1 {% endif %}

    {% if e1 > 0 %}
        PRIME_TOOL1
    {% endif %}

    {% if e0 > 0 %}
        PRIME_TOOL0
    {% endif %}

    ; ----- Step 5: Skew profile (if available) -----
    {% if printer.skew_correction is defined %}
        SKEW_PROFILE LOAD={skew_name}
    {% endif %}

    ; ----- Home X after priming (as in your script) -----
    G28 X

    ; ----- Select initial tool from slicer -----
    {% if initial_tool == 1 %}
        {% if printer["gcode_macro Tool1"] is defined %} Tool1
        {% else %} T1 {% endif %}
    {% else %}
        {% if printer["gcode_macro Tool0"] is defined %} Tool0
        {% else %} T0 {% endif %}
    {% endif %}

    ; ----- Start printing mode if you have that macro -----
    {% if printer["gcode_macro START_PRINTING_MODE"] is defined %}
        START_PRINTING_MODE
    {% endif %}