##################################################################

[printer]
kinematics: generic_cartesian

##################################################################

##################################
# Z Stepper Align
##################################

[z_tilt]
z_positions: -60.1, -3.9            # Z Belt position relativeto origin  (left Z Motor)
               210, 537.5           # Z1 Belt position relativeto origin (back Z Motor)
              481.1, -3.9           # Z2 Belt position relativeto origin (right Z Motor)


points: 80, 92      # probing point left Z Motor
        210, 360    # probing point back Z Motor
        340, 92     # probing point right Z Motor

speed: 200
horizontal_move_z: 7
retries: 10
retry_tolerance: 0.025

##################################
# Bed Mesh
##################################

[bed_mesh]
zero_reference_position: 200, 200
speed: 200
horizontal_move_z: 3
mesh_min: 20, 92
mesh_max: 340, 380
probe_count: 20, 20
mesh_pps: 0, 0
fade_end: 10
fade_target: 0