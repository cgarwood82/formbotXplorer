############################################
# Hack Xplorer Vars (static constants)
# Purpose: provide the small set of constants
# referenced by hack_Macros_2xGantry.cfg without
# depending on the upstream alpha vars file.
#
# If you later want to expand this, copy only the
# values you actually use. These are safe defaults
# and can be tuned for your machine.
############################################

[gcode_macro _XPLORER_VARIABLES]
# Speeds used during mode activation/staging
variable_sp_pmode: 8000     # X feedrate for mode staging
variable_sp_tchy:  10000    # Y feedrate for mode staging

# IDEX (T0/T1) staging X positions
variable_x_cop_idex: 200    # COPY01 X stage for T1
variable_x_mir_idex: 420    # MIRROR01 X stage for T1

# IQEX dual-gantry staging positions (used only in IQEX paths)
variable_x_cop_dg:   0
variable_x_mir_dg:   0
variable_y_cop_dg: 172
variable_y_mir_dg:  58

# Dual-gantry Y offset used in Tool2/Tool3 offsets
variable_y_off_dg:  58

gcode:
    # No-op; vars are read via printer["gcode_macro _XPLORER_VARIABLES"].
