####################################################################
# IQEX/IDEX Calibration (Hack) – Macro-driven motion + hack_tools_calibrate
#
# This file complements klippy/extras/hack_tools_calibrate.py
# It forces PRIMARY mode during calibration and routes all moves via
# macros so that the correct carriage is active for each tool.
####################################################################

#############################
# Load the hack calibrator
#############################

[hack_tools_calibrate]
pin: PF2
travel_speed: 10
spread: 10
lower_z: 0.3
speed: 3
lift_speed: 6
final_lift_z: 6
sample_retract_dist: 5
samples_tolerance: 0.08
samples: 2
samples_result: median
move_via_macros: True
macro_move: CAL_SAFE_MOVE
macro_enter: ENTER_CAL_MODE
macro_leave: LEAVE_CAL_MODE

####################################################################
# Helper macros: enter/leave calibration mode and safe move
####################################################################

[gcode_macro ENTER_CAL_MODE]
# param: TOOL=t0|t1|t2|t3
gcode:
    {% set tool = params.TOOL|default("t0") %}
    {% set svv = printer.save_variables.variables %}
    {% set prev = svv.pmode|default(0) %}
    SAVE_VARIABLE VARIABLE=prev_pmode VALUE={prev}
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE={tool} MODE=PRIMARY

[gcode_macro LEAVE_CAL_MODE]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=gantry0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=gantry1 MODE=PRIMARY

####################################################################
# Move over probe – use your calibrated approach coordinates
####################################################################

[gcode_macro HACK_CALIBRATE_MOVE_OVER_PROBE]
# Optional param TOOL=t0|t1|t2|t3; default maps from active extruder automatically
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set active = printer.toolhead.extruder %}
    {% set tool = params.TOOL|default(active|replace('extruder','t0')|replace('extruder1','t1')|replace('extruder2','t2')|replace('extruder3','t3')) %}
    ENTER_CAL_MODE TOOL={tool}
    BED_MESH_CLEAR
    G1 Z={xplorer.calp_z} F=2000
    G1 X{xplorer.calp_x} Y{xplorer.calp_y} F8000

####################################################################
# Tool offsets calibration – example for T0 (sensor locate) and T1 (offset)
####################################################################

[gcode_macro HACK_AUTO_CALIBRATE_tool_offsets]
gcode:
    {% set svv = printer['save_variables'].variables %}
    M118 Zeroing Offsets ...
    SAVE_VARIABLE VARIABLE=x1offset VALUE=0.0
    SAVE_VARIABLE VARIABLE=y1offset VALUE=0.0
    SAVE_VARIABLE VARIABLE=z1offset VALUE=0.0
    M104 T0 S{svv.tprobe}
    M104 T1 S{svv.tprobe}
    CHECK_HOME
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={svv.tprobe}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={svv.tprobe}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={svv.tprobe} TIMEOUT=300
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={svv.tprobe} TIMEOUT=300
    Brush_Tool0
    Brush_Tool1
    Tool0
    HACK_CALIBRATE_MOVE_OVER_PROBE TOOL=t0
    TOOL_LOCATE_SENSOR
    M104 T0 S0
    Tool1
    HACK_CALIBRATE_MOVE_OVER_PROBE TOOL=t1
    TOOL_CALIBRATE_TOOL_OFFSET
    M104 T1 S0
    PARK_extruder1
    HACK_save_offsets_t1
    LEAVE_CAL_MODE

[gcode_macro HACK_save_offsets_t1]
gcode:
    {% set offsets = printer["hack_tools_calibrate"].last_result %}
    {% if offsets %}
        {% set x_offset = offsets[0]|round(6) %}
        {% set y_offset = offsets[1]|round(6) %}
        {% set z_offset = (offsets[2] * -1)|round(6) %}
        SAVE_VARIABLE VARIABLE=x1offset VALUE={x_offset}
        SAVE_VARIABLE VARIABLE=y1offset VALUE={y_offset}
        SAVE_VARIABLE VARIABLE=z1offset VALUE={z_offset}
        M118 Tool1 Offsets saved: X={x_offset} Y={y_offset} Z={z_offset}
    {% else %}
        M118 Error: No offsets to save. Run TOOL_CALIBRATE_TOOL_OFFSET first.
    {% endif %}

####################################################################
# Probe Z offset calibration using hack_tools_calibrate
####################################################################

[gcode_macro HACK_AUTO_CALIBRATE_probe_offset]
variable_x_offset: 0
variable_y_offset: 18.5
gcode:
    {% set svv = printer.save_variables.variables %}
    M104 T0 S{svv.tprobe}
    Tool0
    CHECK_HOME
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={svv.tprobe}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={svv.tprobe} TIMEOUT=300
    Brush_Tool0
    HACK_CALIBRATE_MOVE_OVER_PROBE TOOL=t0
    TOOL_LOCATE_SENSOR
    G91
    G1 X{x_offset} Y{y_offset} Z15 F5000
    G90
    BASE_PROBE
    G28 Z
    HACK_save_offsets_bedprobe
    M104 T0 S0
    LEAVE_CAL_MODE

[gcode_macro HACK_save_offsets_bedprobe]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set sensor_location = printer["hack_tools_calibrate"].last_result %}
    {% set probe_z = printer["probe"].last_z_result %}
    {% set pzoff_o = printer.configfile.settings["probe"]["z_offset"]|float %}
    {% if sensor_location and probe_z is not none %}
        {% set sensor_z = sensor_location[2] %}
        {% set cz_offset = (probe_z - sensor_z + svv.bp_zoff)|round(3) %}
        {% set z_adjust = (-1*cz_offset + pzoff_o)|round(3) %}
        M118 "Stored Probe Z Offset is : {pzoff_o}"
        M118 "New calculated Z Offset is: {cz_offset}"
        SET_GCODE_OFFSET Z={z_adjust}
        Z_OFFSET_APPLY_PROBE
    {% else %}
        M118 "Error: Missing sensor or probe data."
    {% endif %}
