##################################
# Z Axis -- 3 Steppers
##################################

#   BACK of the printer   #
#                         #
#           Z1            #
#                         #
#       Z       Z2        #
#                         #
#   FRONT of the printer  #
#####################################################################
#  BTT Manta M8P V2 + EXP-MOT Board Pin Mappings and 3-Z Carriage Setup
#####################################################################

[board_pins]
aliases:
    # ---------------- EXP1 Header ----------------
    EXP1_1=GND,
    EXP1_2=+5V,
    EXP1_3=PF11,   # D7  -> free GPIO
    EXP1_4=PF12,   # D6  -> free GPIO
    EXP1_5=PF13,   # D5  -> free GPIO
    EXP1_6=PF14,   # D4  -> free GPIO
    EXP1_7=PF15,   # CS  -> free GPIO
    EXP1_8=PG0,    # EN  -> free GPIO
    EXP1_9=PG1,    # BTN -> free GPIO
    EXP1_10=PE7,   # BEEP-> free GPIO

    # ---------------- EXP2 Header ----------------
    EXP2_1=GND,
    EXP2_2=RESET,
    EXP2_3=PE12,   # ENC_A  -> free GPIO
    EXP2_4=PE11,   # SD_CS  -> free GPIO
    EXP2_5=PE10,   # ENC_B  -> free GPIO
    EXP2_6=PE14,   # SD_MOSI-> free GPIO
    EXP2_7=PE8,    # SD_DET -> free GPIO
    EXP2_8=PE15,   # SD_SCK -> free GPIO
    EXP2_9=NC,
    EXP2_10=PE13   # SD_MISO-> free GPIO

#####################################################################
#  Z Gantry – Three Independent Z-axis Carriages via EXP-MOT
#####################################################################

# ---------------- Primary Z (Front) ----------------
[carriage z]
endstop_pin: PC15
position_endstop: 401
position_max: 401
position_min: -3
homing_speed: 20
homing_retract_dist: 10.0
homing_retract_speed: 10
second_homing_speed: 5

[stepper z]
carriages: z
step_pin: EXP2_6
dir_pin: EXP2_5
enable_pin: !EXP2_7
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z]
uart_pin: EXP1_6
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z1 (Back) ----------------
[extra_carriage z1]
primary_carriage: z
endstop_pin: PF0

[stepper z1]
carriages: z1
step_pin: EXP2_3
dir_pin: EXP2_4
enable_pin: !EXP1_8
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z1]
uart_pin: EXP1_4
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z2 (Right) ----------------
[extra_carriage z2]
primary_carriage: z
endstop_pin: PF1

[stepper z2]
carriages: z2
step_pin: EXP2_1
dir_pin: EXP2_2
enable_pin: !EXP1_7
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z2]
uart_pin: EXP1_2
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999
