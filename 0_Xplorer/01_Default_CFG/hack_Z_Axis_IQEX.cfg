##################################
# Z Axis -- 3 Steppers
##################################

#   BACK of the printer   #
#                         #
#           Z1            #
#                         #
#       Z       Z2        #
#                         #
#   FRONT of the printer  #
#####################################################################
#  BTT Manta M8P V2 + EXP-MOT Board Pin Mappings and 3-Z Carriage Setup
#####################################################################

[board_pins]
aliases:
    # ---------------- EXP1 Header ----------------
    EXP1_1=GND,          # Ground
    # EXP1_2=+5V,          # 5V logic rail
    EXP1_3=PF11,         # M3_STEP
    EXP1_4=PF15,         # M2_UART
    EXP1_5=PF12,         # M3_DIR
    EXP1_6=PG0,          # M1_UART
    EXP1_7=PF13,         # M3_EN (Enable)
    EXP1_8=PG1,          # M2_EN (Enable)
    EXP1_9=PF14,         # Shared SPI_MOSI (unused by Klipper)
    EXP1_10=PE7,         # Shared SPI_MISO (unused by Klipper)

    # ---------------- EXP2 Header ----------------
    EXP2_1=PE15,         # M1_STEP
    EXP2_2=PE11,         # M1_DIR
    EXP2_3=PE10,         # M2_STEP
    EXP2_4=PE12,         # M2_DIR
    EXP2_5=PE13,         # M3_UART
    EXP2_6=PE14,         # Shared SPI_SCK (unused by Klipper)
    EXP2_7=PE8,          # M1_EN (Enable)
    EXP2_8=PF0,          # optional/free GPIO
    # EXP2_9=NC,           # not connected
    EXP2_10=PF1,         # optional/free GPIO


#####################################################################
#  Z Gantry – Three Independent Z-axis Carriages via EXP-MOT
#####################################################################

# ---------------- Primary Z (Front) ----------------
[carriage z]
endstop_pin: PC15
#endstop_pin: probe:z_virtual_endstop
position_endstop: 401
position_max: 401
position_min: -3
homing_speed: 20
homing_retract_dist: 10.0
homing_retract_speed: 10
second_homing_speed: 5

[stepper z]
carriages: z
step_pin: EXP2_1        # M1_STEP
dir_pin: EXP2_2         # M1_DIR
enable_pin: !EXP2_7     # M1_EN
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z]
uart_pin: EXP1_6        # M1_UART
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z1 (Back) ----------------
[extra_carriage z1]
primary_carriage: z
endstop_pin: PF0
#endstop_pin: probe:z_virtual_endstop

[stepper z1]
carriages: z1
step_pin: EXP2_3        # M2_STEP
dir_pin: EXP2_4         # M2_DIR
enable_pin: !EXP1_8     # M2_EN
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z1]
uart_pin: EXP1_4        # M2_UART
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z2 (Right) ----------------
[extra_carriage z2]
primary_carriage: z
endstop_pin: PF1
#endstop_pin: probe:z_virtual_endstop

[stepper z2]
carriages: z2
step_pin: EXP1_3        # M3_STEP
dir_pin: EXP1_5         # M3_DIR
enable_pin: !EXP1_7     # M3_EN
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z2]
uart_pin: PA7        # M3_UART
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999

