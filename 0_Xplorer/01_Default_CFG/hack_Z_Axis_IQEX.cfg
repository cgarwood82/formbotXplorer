##################################
# Z Axis -- 3 Steppers
##################################

#   BACK of the printer   #
#                         #
#           Z1            #
#                         #
#       Z       Z2        #
#                         #
#   FRONT of the printer  #

#####################################################################
#  Z Gantry – Three Independent Z-axis Carriages
#####################################################################

# ---------------- Primary Z (Front) ----------------
[carriage z]
endstop_pin: PC15
position_endstop: 401
position_max: 401
position_min: -3
homing_speed: 20
homing_retract_dist: 10.0
homing_retract_speed: 10
second_homing_speed: 5

[stepper z]
carriages: z
step_pin: skr:PB0
dir_pin: skr:PC5
enable_pin: skr:!PB1
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z]
uart_pin: skr:PC11
uart_address: 0
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z1 (Back) ----------------
[extra_carriage z1]
primary_carriage: z
endstop_pin: PF0

[stepper z1]
carriages: z1
step_pin: skr:PB10
dir_pin: skr:!PB2
enable_pin: skr:!PB11
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z1]
uart_pin: skr:PC11
uart_address: 1
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z2 (Right) ----------------
[extra_carriage z2]
primary_carriage: z
endstop_pin: PF1

[stepper z2]
carriages: z2
step_pin: skr:PB13
dir_pin: skr:!PB12
enable_pin: skr:!PB14
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z2]
uart_pin: skr:PC11
uart_address: 2
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999

