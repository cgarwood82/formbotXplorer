##################################
# Z Axis -- 3 Steppers
##################################

#   BACK of the printer   #
#                         #
#           Z1            #
#                         #
#       Z       Z2        #
#                         #
#   FRONT of the printer  #
#####################################################################
#  BTT Manta M8P V2 + EXP-MOT Board Pin Mappings and 3-Z Carriage Setup
#####################################################################

[board_pins]
aliases:
    # ---------------- EXP1 Header ----------------
    EXP1_1=GND
    EXP1_2=+5V
    EXP1_3=PF11        # M3_STEP
    EXP1_4=PF15        # M2_UART
    EXP1_5=PF12        # M3_DIR
    EXP1_6=PG0         # M1_UART
    EXP1_7=PF13        # M3_EN
    EXP1_8=PG1         # M2_EN
    EXP1_9=PF14        # SPI_MOSI (shared)
    EXP1_10=PE7        # SPI_MISO (shared)

    # ---------------- EXP2 Header ----------------
    EXP2_1=PE15        # M1_STEP
    EXP2_2=PE11        # M1_DIR
    EXP2_3=PE10        # M2_STEP
    EXP2_4=PE11        # M2_DIR
    EXP2_5=PE10        # M3_UART
    EXP2_6=PE14        # SPI_SCK (shared)
    EXP2_7=PE8         # M1_EN
    EXP2_8=PE12        # spare
    EXP2_9=NC
    EXP2_10=PE13       # optional/diag


#####################################################################
#  Z Gantry – Three Independent Z-axis Carriages via EXP-MOT
#####################################################################

# ---------------- Primary Z (Front) ----------------
[carriage z]
endstop_pin: PC15
position_endstop: 401
position_max: 401
position_min: -3
homing_speed: 20
homing_retract_dist: 10.0
homing_retract_speed: 10
second_homing_speed: 5

[stepper z]
carriages: z
step_pin: EXP2_6
dir_pin: EXP2_5
enable_pin: !EXP2_7
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z]
uart_pin: EXP1_6
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z1 (Back) ----------------
[extra_carriage z1]
primary_carriage: z
endstop_pin: PF0

[stepper z1]
carriages: z1
step_pin: EXP2_3
dir_pin: EXP2_4
enable_pin: !EXP1_8
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z1]
uart_pin: EXP1_4
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999


# ---------------- Z2 (Right) ----------------
[extra_carriage z2]
primary_carriage: z
endstop_pin: PF1

[stepper z2]
carriages: z2
step_pin: EXP2_1
dir_pin: EXP2_2
enable_pin: !EXP1_7
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper z2]
uart_pin: EXP1_2
run_current: 1.4
hold_current: 0.9
stealthchop_threshold: 999999
