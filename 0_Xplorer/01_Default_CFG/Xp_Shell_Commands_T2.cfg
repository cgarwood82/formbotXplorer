##################################
# Shell Commands
##################################
#######################################################
# Flash xplorer Tool2 EBB36
#######################################################

[gcode_shell_command flash_mcu_t2]
command: sh $HOME/printer_data/config/0_Xplorer/.9_MCU_Flash/scripts/flash_EBB36T2.sh
timeout: 80

[gcode_macro Flash_Tool2]
description: This macro flashes the Tool2 board with the latest Klipper version from your system
gcode:
    M118 This will flash the Tool2 boars with the latest Klipper firmware.
    M118 The process may take a few minutes, so be patient.
    RUN_SHELL_COMMAND CMD=flash_mcu_t2
    M118 Flash is COMPLETE

#######################################################
# Measure resonances on X-Axis
#######################################################

[gcode_shell_command resonances_x_t2]
command: sh $HOME/printer_data/config/0_Xplorer/.8_Scripts/resonances_X_t2.sh
timeout: 80

[gcode_macro Measure_Resonances_X_T2]
description: This macro mesures the resonances on the X-Axis and save a graphical representation as PNG-file
gcode:
    T2
    M118 This will measure the resonances on X-Axis for Tool2.
    M118 The process may take a few minutes, so be patient.
    CHECK_HOME
    #G28
    G1 X210 Y200 F10000
    G1 Z50 F2000
    TEST_RESONANCES AXIS=X ACCELEROMETER=Tool2
    RUN_SHELL_COMMAND CMD=resonances_x_t2
    M118 Resonance test is complete. Check the PNG file for details

