[gcode_macro PARK_extruder]
gcode:
    {% set svv = printer.save_variables.variables %}  
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %} 
    # Ensure copy/mirror is not engaged on X or Y before parking
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    # Back gantry (gantry0) and rear X carriage (Tool0)
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t0

    {% if svv.shaper_type_xt0 is defined and
          svv.shaper_freq_xt0 is defined and
          svv.shaper_type_yt0 is defined and
          svv.shaper_freq_yt0 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xt0} SHAPER_FREQ_X={svv.shaper_freq_xt0} SHAPER_TYPE_Y={svv.shaper_type_yt0} SHAPER_FREQ_Y={svv.shaper_freq_yt0}
    {% endif %}

    SAVE_GCODE_STATE NAME=park0
    G90
    SET_GCODE_OFFSET X=0
    SET_GCODE_OFFSET Y=0
    SET_VELOCITY_LIMIT VELOCITY=220 ACCEL=10000
    G1 X0 F{xplorer.sp_tch}
    SET_VELOCITY_LIMIT VELOCITY=220 ACCEL=5000
    G1 Y449 F{xplorer.sp_tchy}
    RESTORE_GCODE_STATE NAME=park0

##################################
# Park Tool1 2xGantry
##################################

[gcode_macro PARK_extruder1]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %} 
    # Ensure copy/mirror is not engaged on X or Y before parking
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    # Back gantry (gantry0) and rear X dual carriage (Tool1)
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1

    {% if svv.shaper_type_xt1 is defined and
          svv.shaper_freq_xt1 is defined and
          svv.shaper_type_yt1 is defined and
          svv.shaper_freq_yt1 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xt1} SHAPER_FREQ_X={svv.shaper_freq_xt1} SHAPER_TYPE_Y={svv.shaper_type_yt1} SHAPER_FREQ_Y={svv.shaper_freq_yt1}
    {% endif %}

    SAVE_GCODE_STATE NAME=park1
    G90
    SET_GCODE_OFFSET X=0
    SET_GCODE_OFFSET Y=0
    SET_VELOCITY_LIMIT VELOCITY=220 ACCEL=10000
    G1 X419 F{xplorer.sp_tch}
    # Y move not used for back gantry park in IQEX
    RESTORE_GCODE_STATE NAME=park1


##################################
# Activate Tool0 
##################################

[gcode_macro Tool0]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    G1 F{xplorer.sp_tch}
    {% if printer.toolhead.extruder != "extruder" %}
        PARK_{printer.toolhead.extruder}
    {% endif %}    
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    # Back gantry rear carriage
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t0
    SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xt0} SHAPER_FREQ_X={svv.shaper_freq_xt0} SHAPER_TYPE_Y={svv.shaper_type_yt0} SHAPER_FREQ_Y={svv.shaper_freq_yt0}
    SET_GCODE_OFFSET X=0 Y=0 Z=0

[gcode_macro T0]
gcode:

##################################
# Activate Tool1
##################################

[gcode_macro Tool1]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}    
    G1 F{xplorer.sp_tch}
    {% if printer.toolhead.extruder != "extruder1" %}
        PARK_{printer.toolhead.extruder}
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    # Back gantry rear dual carriage
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1
    
    {% if svv.shaper_type_xt1 is defined and
          svv.shaper_freq_xt1 is defined and
          svv.shaper_type_yt1 is defined and
          svv.shaper_freq_yt1 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xt1} SHAPER_FREQ_X={svv.shaper_freq_xt1} SHAPER_TYPE_Y={svv.shaper_type_yt1} SHAPER_FREQ_Y={svv.shaper_freq_yt1}
    {% endif %}
    
    {% set y1 = (svv.y1offset|default(0)|float) - (xplorer.y_off_dg|default(0)|float) %}
    SET_GCODE_OFFSET X={svv.x1offset} Y={y1} Z={svv.z1offset}

[gcode_macro T1]
gcode:
    
####################################################################
# Copy Mode 2xGantry
####################################################################

[gcode_macro ACTIVATE_COPY_MODE]
gcode:
    M118 Activating COPY mode
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %} 
    {% set ptype = svv.ptype|default(1)|int %}  # 0=IDEX (back only), 1=IQEX (both)

    # Set dual carriage pairs to PRIMARY first
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY

    # Move to safe position and select Tool0 as the driving tool
    G1 X0 F{xplorer.sp_pmode}
    G1 Y400 F{xplorer.sp_tch}
    ACTIVATE_EXTRUDER EXTRUDER=extruder

    # Move to copy-mode start coordinates (uses your dg defaults)
    G1 X{xplorer.x_cop_dg}
    G1 Y{xplorer.y_cop_dg}

    # Enable COPY depending on platform type
    # X dual carriage (T1 follows T0) is always enabled in COPY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=COPY

    {% if ptype == 1 %}
        # IQEX: also COPY on the front Y gantry (gantry1 follows gantry0)
        SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=COPY
    {% else %}
        # IDEX: keep front gantry idle in PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    {% endif %}

    # Sync extruder motions (extruder1 mirrors extruder)
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

    SAVE_VARIABLE VARIABLE=pmode VALUE=1
    
    {% if svv.shaper_type_x2xGantrycp is defined and
          svv.shaper_freq_x2xGantrycp is defined and
          svv.shaper_type_y2xGantrycp is defined and
          svv.shaper_freq_y2xGantrycp is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_x2xGantrycp} SHAPER_FREQ_X={svv.shaper_freq_x2xGantrycp} SHAPER_TYPE_Y={svv.shaper_type_y2xGantrycp} SHAPER_FREQ_Y={svv.shaper_freq_y2xGantrycp}
    {% endif %}


####################################################################
# Mirror Mode 2xGantry
####################################################################

[gcode_macro ACTIVATE_MIRROR_MODE]
gcode:
    M118 Activating MIRROR mode !
    {% set svv = printer.save_variables.variables %}
    {% set cfg = printer.configfile.settings %}
    {% set ptype = svv.ptype|default(1)|int %}  # 0=IDEX (back only), 1=IQEX (both)
    # Access hack Xplorer vars (included in hack_IQEX.cfg)
    {% set xpl = printer["gcode_macro _XPLORER_VARIABLES"] %}
    {% set sp_p = xpl.sp_pmode|int %}
    {% set sp_y = xpl.sp_tchy|int %}
    {% set x_m  = xpl.x_cop_idex|float %}
    {% set x_mir = xpl.x_mir_idex|float %}
    {% set y_mir = xpl.y_mir_dg|float %}

    # Read limits from config (with safe defaults)
    {% set rear_y_min = cfg["carriage carriage_gantry0_left"].position_min|default(140)|float %}
    {% set front_y_max = cfg["dual_carriage carriage_gantry1_left"].position_max|default(410)|float %}

    {% set x0_min = cfg["carriage carriage_t0"].position_min|default(0)|float %}
    {% set x1_max = cfg["dual_carriage carriage_t1"].position_max|default(419)|float %}
    {% set x2_min = cfg["carriage carriage_t2"].position_min|default(0)|float %}
    {% set x3_max = cfg["dual_carriage carriage_t3"].position_max|default(419)|float %}

    {% set x_right = [x1_max, x3_max]|min %}
    {% set x_left  = [x0_min, x2_min]|max %}
    {% set x_center = 0.5 * (x_right + x_left) %}
    {% set y_center = 0.5 * (front_y_max + rear_y_min) %}

    # Ensure absolute mode, safe Z, and decouple pairs safely first
    G90

    {% if ptype == 0 %}
        # Stage T0
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t0
        G1 X0 F{sp_p}

        # Stage T1 at mirror X point
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t1
        G1 X{ x_mir } F{sp_p}

        # Critically: assert primary NOW, then switch secondary to MIRROR
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t0 MODE=PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=MIRROR
        SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left MODE=PRIMARY

    {% else %}

        # IQEX MIRROR (T0/T1 and T2/T3)

        # Stage T0
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t0
        G1 X0 F{sp_p}

        # Stage T1 at mirror X point
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t1
        G1 X{ x_mir } F{sp_p}

        # Stage T2 at mirror X point
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t2
        G1 X0 F{sp_p}

        # Stage T3 at mirror X point
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t3
        G1 X{ x_mir } F{sp_p}
        # Critically: assert primary NOW, then switch secondary to MIRROR
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t0 MODE=PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=MIRROR
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t2 MODE=COPY
        SET_DUAL_CARRIAGE CARRIAGE=carriage_t3 MODE=MIRROR
        SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left MODE=PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=COPY

    {% endif %}

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SAVE_VARIABLE VARIABLE=pmode VALUE=2

    {% if svv.shaper_type_x2xGantrymr is defined and
          svv.shaper_freq_x2xGantrymr is defined and
          svv.shaper_type_y2xGantrymr is defined and
          svv.shaper_freq_y2xGantrymr is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_x2xGantrymr} SHAPER_FREQ_X={svv.shaper_freq_x2xGantrymr} SHAPER_TYPE_Y={svv.shaper_type_y2xGantrymr} SHAPER_FREQ_Y={svv.shaper_freq_y2xGantrymr}
    {% endif %}

    
####################################################################
# Normal Mode 2xGantry
####################################################################

[gcode_macro ACTIVATE_PRIMARY_MODE]
gcode:
    M118 Activating PRIMARY Printing Mode !
    {% set svv = printer.save_variables.variables %}
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1  
    SAVE_VARIABLE VARIABLE=pmode VALUE=0
    PARK_extruder1
    T0

####################################################################
# Set variables at startup
####################################################################

[delayed_gcode var_startup]
initial_duration: 1
gcode:    
    _SET_TIMELAPSE_SETUP PARK_ENABLE=True PARK_POS=custom CUSTOM_POS_Y=150 ; raised to respect rear gantry Y>=140 when T0/T1 active
    SAVE_VARIABLE VARIABLE=pmode VALUE=0
    SAVE_VARIABLE VARIABLE=ttovr VALUE=0
    SAVE_VARIABLE VARIABLE=xy_resume VALUE=1
    {% if printer.save_variables.variables.ptype is not defined %}
        # ptype: 0=IDEX (back only), 1=IQEX (both gantries). Default to IQEX.
        SAVE_VARIABLE VARIABLE=ptype VALUE=1
    {% endif %}
    SKEW_PROFILE LOAD=SKEW0

####################################################################
# Query which printing mode is active
####################################################################

[gcode_macro QUERY_PRINTING_MODE]
gcode:
    {% set svv = printer.save_variables.variables %}
    {%if svv.pmode == 0%}
     M118 PRIMARY Printing Mode is activated for the next print!
    {%endif%}
    {%if svv.pmode == 1%}
     M118 COPY Printing Mode is activated for the next print!
   {%endif%}
    {%if svv.pmode == 2%}
     M118 MIRROR Printing Mode is activated for the next print!
   {%endif%}

####################################################################
# Start print mode
####################################################################

[gcode_macro START_PRINTING_MODE]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.pmode == 0 %}
        M118 PRIMARY Printing Mode is active
        #ACTIVATE_PRIMARY_MODE
        # Primary mode is the default, no need to set it
    {% elif svv.pmode == 1 %}
        ACTIVATE_COPY_MODE
    {% elif svv.pmode == 2 %}
        ACTIVATE_MIRROR_MODE
    {% endif %}
   
####################################################################
# SET print mode
####################################################################

[gcode_macro SET_PRINT_MODE]
description: Set the printing mode (PRIMARY, COPY, MIRROR) and optionally the platform (IDEX or IQEX)

gcode:
    {% set mode = params.MODE|default("PRIMARY;COPY;MIRROR") %}
    {% set platform = params.PLATFORM|default(none) %}
    {% set svv = printer.save_variables.variables %}

    # Optional platform selection: IDEX (back-only X copy/mirror) or IQEX (both gantries)
    {% if platform is not none %}
        {% if platform|upper == "IDEX" %}
            SAVE_VARIABLE VARIABLE=ptype VALUE=0
            M118 Platform set to IDEX (back gantry only)
        {% elif platform|upper == "IQEX" %}
            SAVE_VARIABLE VARIABLE=ptype VALUE=1
            M118 Platform set to IQEX (both gantries)
        {% else %}
            M118 Invalid PLATFORM. Use IDEX or IQEX.
        {% endif %}
    {% endif %}

    # Set print mode
    {% if mode == "PRIMARY" %}
        SAVE_VARIABLE VARIABLE=pmode VALUE=0
        M118 Print Mode: PRIMARY
    {% elif mode == "COPY" %}
        {% if svv.ttovr == 1 or svv.ttovr == 2 %}
            M118 COPY Mode is not compatible with Toolhead take over strategy !!!
        {% else %}
            SAVE_VARIABLE VARIABLE=pmode VALUE=1
            M118 Print Mode: COPY
        {% endif %}
    {% elif mode == "MIRROR" %}
        {% if svv.ttovr == 1 or svv.ttovr == 2 %}
            M118 MIRROR Mode is not compatible with Toolhead take over strategy !!!
        {% else %}
            SAVE_VARIABLE VARIABLE=pmode VALUE=2
            M118 Print Mode: MIRROR
        {% endif %}
    {% else %}
        M118 Invalid Print Mode! Available printing modes are: PRIMARY (default), COPY, and MIRROR.
    {% endif %}

####################################################################
# SET Toolhead Takeover
####################################################################

[gcode_macro SET_TOOLHEAD_TAKEOVER]
description: Set the Toolhead takeover strategy when filament runs out

gcode:
    {% set toolhead = params.TOOLHEAD|default("None;Tool0;Tool1") %}
    {% set svv = printer.save_variables.variables %}

    {% if toolhead == "None" %}
        SAVE_VARIABLE VARIABLE=ttovr VALUE=0
        M118 When filament runs out, no toolhead will take over.
    
    {% elif toolhead == "Tool0" %}
        {% if svv.pmode == 1 or svv.pmode == 2 %}
            M118 Toolhead take over is not compatible with COPY and MIRROR mode !!!
        {% else %}
            SAVE_VARIABLE VARIABLE=ttovr VALUE=1
            SAVE_VARIABLE VARIABLE=ttover_resume VALUE=1
            M118 When filament runs out on Tool 1 then Tool 0 will take over.
        {% endif %}

    {% elif toolhead == "Tool1" %}
        {% if svv.pmode == 1 or svv.pmode == 2 %}
            M118 Toolhead takeover is not compatible with COPY and MIRROR mode!
        {% else %}
            SAVE_VARIABLE VARIABLE=ttovr VALUE=2
            SAVE_VARIABLE VARIABLE=ttover_resume VALUE=2
            M118 When filament runs out on Tool 0 then Tool 1 will take over.
        {% endif %}

    {% else %}
        M118 Invalid input! Available modes are: None (default), Tool0, and Tool1.
    {% endif %}


####################################################################
# Query Toolhead Takeover
####################################################################

[gcode_macro QUERY_TOOLHEAD_TAKEOVER]
gcode:
    {% set svv = printer.save_variables.variables %}
    {%if svv.ttovr == 0%}
    M118 NO Toolhead take over strategy is activated!
    {%endif%}
    {%if svv.ttovr == 1%}
    M118 IF Tool1 remains out of filament, then Tool0 will take over and continue the print
   {%endif%}
    {%if svv.ttovr == 2%}
    M118 IF Tool0 remains out of filament, then Tool1 will take over and continue the print
   {%endif%}

######################################################################
# Toolhead 0 Takeover
######################################################################

[gcode_macro TTOVER0]
variable_zhop: 0
variable_e1temp: 0

gcode:
    M118 Tool0 is taking over and continues the print...
    
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set sensor = printer['gcode_macro _SENSOR_t1_VARIABLES'] %}
    {% set z = params.Z|default(10)|int %}
    {% set e1temp = printer['extruder1'].target|int %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% set current_z = printer.gcode_move.position.z %}
    {% set paused = printer['pause_resume'].is_paused %}

    {% if not paused %}
      
        SET_GCODE_VARIABLE MACRO=TTOVER0 VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=TTOVER0 VARIABLE=e1temp VALUE={e1temp}
        SAVE_GCODE_STATE NAME=TTOVER0                         
        M104 T0 S{e1temp}        
        {% if current_z + z < zmax %}
            G91
            G1 Z{z} F900              ; z-hop up
            G90
        {% else %}
            M118 Z-hop too high — skipping Z lift
            SET_GCODE_VARIABLE MACRO=TTOVER0 VARIABLE=zhop VALUE=0
        {% endif %}
        PARK_extruder1
        M83
        G92 E0
        G91
        G0 E-{sensor.t1_unload_distance} F300
        M400
        M104 T1 S0 
        G90
        Tool0                         ; Your custom macro for T0 activation
        G1 X{xplorer.xrest0} F5000
        M109 T0 S{e1temp}
        M118 Heatng Tool0
        G1 E30 F900                  ; prime Tool 0
        M400
        PARK_extruder
        M400
        RESTORE_GCODE_STATE NAME=TTOVER0 MOVE=1 MOVE_SPEED=100
        Tool0

    {% else %}
        M118 Cannot make the takeover while paused!
    {% endif %}

######################################################################
# Toolhead 1 Takeover
######################################################################

[gcode_macro TTOVER1]
variable_zhop: 0
variable_etemp: 0

gcode:
    M118 Tool1 is taking over and continues the print...
    
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set sensor = printer['gcode_macro _SENSOR_t0_VARIABLES'] %}
    {% set z = params.Z|default(10)|int %}
    {% set etemp = printer['extruder'].target|int %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% set current_z = printer.gcode_move.position.z %}
    {% set paused = printer['pause_resume'].is_paused %}

    {% if not paused %}
      
        SET_GCODE_VARIABLE MACRO=TTOVER1 VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=TTOVER1 VARIABLE=etemp VALUE={etemp}
        SAVE_GCODE_STATE NAME=TTOVER1                          
        M104 T1 S{etemp}        
        {% if current_z + z < zmax %}
            G91
            G1 Z{z} F900              ; z-hop up
            G90
        {% else %}
            M118 Z-hop too high — skipping Z lift
            SET_GCODE_VARIABLE MACRO=TTOVER1 VARIABLE=zhop VALUE=0
        {% endif %}
        PARK_extruder
        M83
        G92 E0
        G91
        G0 E-{sensor.t0_unload_distance} F300
        M400
        M104 T0 S0 
        G90
        Tool1                         ; Your custom macro for T1 activation
        G1 X{xplorer.xrest1} F5000
        M109 T1 S{etemp}
        M118 Heatng Tool1
        G1 E30 F900                  ; prime Tool 1
        M400
        PARK_extruder1
        M400
        RESTORE_GCODE_STATE NAME=TTOVER1 MOVE=1 MOVE_SPEED=100
        Tool1

    {% else %}
        M118 Cannot make the takeover while paused!
    {% endif %}

######################################################################
# Toolhead 2 Takeover (T2 takes over from T3)
######################################################################

[gcode_macro TTOVER2]
variable_zhop: 0
variable_e3temp: 0

gcode:
    M118 Tool2 is taking over and continues the print...
    
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set sensor = printer['gcode_macro _SENSOR_t3_VARIABLES'] %}
    {% set z = params.Z|default(10)|int %}
    {% set e3temp = printer['extruder3'].target|int %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% set current_z = printer.gcode_move.position.z %}
    {% set paused = printer['pause_resume'].is_paused %}

    {% if not paused %}
      SET_GCODE_VARIABLE MACRO=TTOVER2 VARIABLE=zhop VALUE={z}
      SET_GCODE_VARIABLE MACRO=TTOVER2 VARIABLE=e3temp VALUE={e3temp}
      SAVE_GCODE_STATE NAME=TTOVER2
      M104 T2 S{e3temp}
      {% if current_z + z < zmax %}
        G91
        G1 Z{z} F900              ; z-hop up
        G90
      {% else %}
        M118 Z-hop too high — skipping Z lift
        SET_GCODE_VARIABLE MACRO=TTOVER2 VARIABLE=zhop VALUE=0
      {% endif %}
      PARK_extruder3
      M83
      G92 E0
      G91
      G0 E-{sensor.t3_unload_distance} F300
      M400
      M104 T3 S0
      G90
      Tool2
      M109 T2 S{e3temp}
      M118 Heating Tool2
      G1 E30 F900
      M400
      PARK_extruder2
      M400
      RESTORE_GCODE_STATE NAME=TTOVER2 MOVE=1 MOVE_SPEED=100
      Tool2
    {% else %}
      M118 Cannot make the takeover while paused!
    {% endif %}

######################################################################
# Toolhead 3 Takeover (T3 takes over from T2)
######################################################################

[gcode_macro TTOVER3]
variable_zhop: 0
variable_e2temp: 0

gcode:
    M118 Tool3 is taking over and continues the print...
    
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set sensor = printer['gcode_macro _SENSOR_t2_VARIABLES'] %}
    {% set z = params.Z|default(10)|int %}
    {% set e2temp = printer['extruder2'].target|int %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% set current_z = printer.gcode_move.position.z %}
    {% set paused = printer['pause_resume'].is_paused %}

    {% if not paused %}
      SET_GCODE_VARIABLE MACRO=TTOVER3 VARIABLE=zhop VALUE={z}
      SET_GCODE_VARIABLE MACRO=TTOVER3 VARIABLE=e2temp VALUE={e2temp}
      SAVE_GCODE_STATE NAME=TTOVER3
      M104 T3 S{e2temp}
      {% if current_z + z < zmax %}
        G91
        G1 Z{z} F900              ; z-hop up
        G90
      {% else %}
        M118 Z-hop too high — skipping Z lift
        SET_GCODE_VARIABLE MACRO=TTOVER3 VARIABLE=zhop VALUE=0
      {% endif %}
      PARK_extruder2
      M83
      G92 E0
      G91
      G0 E-{sensor.t2_unload_distance} F300
      M400
      M104 T2 S0
      G90
      Tool3
      M109 T3 S{e2temp}
      M118 Heating Tool3
      G1 E30 F900
      M400
      PARK_extruder3
      M400
      RESTORE_GCODE_STATE NAME=TTOVER3 MOVE=1 MOVE_SPEED=100
      Tool3
    {% else %}
      M118 Cannot make the takeover while paused!
    {% endif %}


#######################################
# END_PRINT 2xGantry
#######################################

[gcode_macro END_PRINT]
gcode:
    {% set svv = printer.save_variables.variables %}
    SET_SKEW CLEAR=1

    # Heaters and fans off
    M104 T0 S0
    M104 T1 S0
    {% if printer['extruder2'] is defined %}M104 T2 S0{% endif %}
    {% if printer['extruder3'] is defined %}M104 T3 S0{% endif %}
    M140 S0
    SET_FAN_SPEED FAN=Tool_0_partfan Speed=0.0
    SET_FAN_SPEED FAN=Tool_1_partfan Speed=0.0
    {% if printer['fan_generic Tool_2_partfan'] is defined %}SET_FAN_SPEED FAN=Tool_2_partfan Speed=0.0{% endif %}
    {% if printer['fan_generic Tool_3_partfan'] is defined %}SET_FAN_SPEED FAN=Tool_3_partfan Speed=0.0{% endif %}

    # Small retract and tiny z-hop
    G91
    G1 E-3 F300
    M117 RETRACT
    G1 Z+0.5 E-3 F9000
    G1 E-10
    M117 WIPE OUT
    G90

    # Decouple carriages and unlink extruders (no follow motion after end)
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    {% if printer["dual_carriage carriage_t3"] is defined %}SET_DUAL_CARRIAGE CARRIAGE=carriage_t3 MODE=PRIMARY{% endif %}
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    {% if printer['extruder2'] is defined %}SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder2{% endif %}
    {% if printer['extruder3'] is defined %}SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder3{% endif %}

    # Clear mesh, save persistent flags
    M117 PRESENT ITEM
    BED_MESH_CLEAR
    M141 S40 ; Start Chamber fan at 40 Deg
    SAVE_VARIABLE VARIABLE=pmode VALUE=0
    SAVE_VARIABLE VARIABLE=ttovr VALUE=0
    SET_VELOCITY_LIMIT VELOCITY=300 ACCEL=5000

    # Home Z to unload the belted Z (per your preference)
    G28 Z

    M400
    # Park ONLY the currently active tool (no tool switching here)
    {% if printer.toolhead.extruder == "extruder" %}
        PARK_extruder
    {% elif printer.toolhead.extruder == "extruder1" %}
        PARK_extruder1
    {% elif printer.toolhead.extruder == "extruder2" and printer['gcode_macro PARK_extruder2'] is defined %}
        PARK_extruder2
    {% elif printer.toolhead.extruder == "extruder3" and printer['gcode_macro PARK_extruder3'] is defined %}
        PARK_extruder3
    {% endif %}

    SKEW_PROFILE LOAD=SKEW0
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Electronics_fan TARGET=50
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    SAVE_VARIABLE VARIABLE=xy_resume VALUE=1
    SAVE_VARIABLE VARIABLE=ttover_resume VALUE=0
    clear_last_file
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
    G31
    UPDATE_DELAYED_GCODE ID=SAVE_XY_TIMER DURATION=0
    printend_audio
    {% if svv.pwrendp == 0 %}
        END_PRINT_OFF
    {% endif %}

########################################
# Part cooling Fan 2xGantry
########################################

[gcode_macro M106]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set active = printer.toolhead.extruder %}
    {% set pmode = svv.pmode|default(0)|int %}
    {% if params.S is defined %}
        {% set realspeed = params.S|int / 255 %}
        {% if active == "extruder" %}
            SET_FAN_SPEED FAN=Tool_0_partfan Speed={realspeed}
            {% if pmode in [1, 2] %}
                SET_FAN_SPEED FAN=Tool_1_partfan Speed={realspeed}
            {% endif %}
        {% elif active == "extruder1" %}
            SET_FAN_SPEED FAN=Tool_1_partfan Speed={realspeed}
        {% elif active == "extruder2" %}
            SET_FAN_SPEED FAN=Tool_2_partfan Speed={realspeed}
            {% if pmode in [1, 2] %}
                SET_FAN_SPEED FAN=Tool_3_partfan Speed={realspeed}
            {% endif %}
        {% elif active == "extruder3" %}
            SET_FAN_SPEED FAN=Tool_3_partfan Speed={realspeed}
        {% else %}
            # Default behavior if no specific extruder is active
            SET_FAN_SPEED FAN=Tool_0_partfan Speed={realspeed}
            SET_FAN_SPEED FAN=Tool_1_partfan Speed={realspeed}
            SET_FAN_SPEED FAN=Tool_2_partfan Speed={realspeed}
            SET_FAN_SPEED FAN=Tool_3_partfan Speed={realspeed}
        {% endif %}
    {% else %}
        # Default to full speed if no S parameter is provided
        {% if active == "extruder" %}
            SET_FAN_SPEED FAN=Tool_0_partfan Speed=1.0
            {% if pmode in [1, 2] %}
                SET_FAN_SPEED FAN=Tool_1_partfan Speed=1.0
            {% endif %}
        {% elif active == "extruder1" %}
            SET_FAN_SPEED FAN=Tool_1_partfan Speed=1.0
        {% elif active == "extruder2" %}
            SET_FAN_SPEED FAN=Tool_2_partfan Speed=1.0
            {% if pmode in [1, 2] %}
                SET_FAN_SPEED FAN=Tool_3_partfan Speed=1.0
            {% endif %}
        {% elif active == "extruder3" %}
            SET_FAN_SPEED FAN=Tool_3_partfan Speed=1.0
        {% else %}
            SET_FAN_SPEED FAN=Tool_0_partfan Speed=1.0
            SET_FAN_SPEED FAN=Tool_1_partfan Speed=1.0
            SET_FAN_SPEED FAN=Tool_2_partfan Speed=1.0
            SET_FAN_SPEED FAN=Tool_3_partfan Speed=1.0
        {% endif %}
    {% endif %}


