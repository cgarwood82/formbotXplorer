######################################################################
# Filament Change M600 2xGantry
######################################################################
# After filament has # been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[gcode_macro M600]
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set z = params.Z|default(10)|int %}                                                   # z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              # set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    # set hotend temp variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=e1temp VALUE={printer['extruder1'].target}
        SAVE_GCODE_STATE NAME=PAUSE                                                          # save current print position for resume
        BASE_PAUSE                                                                           # pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       # check that zhop doesn't exceed z max
            G91                                                                              # relative positioning
            G1 Z{z} F900                                                                     # raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  # if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  # absolute positioning    
        G1  X11 Y{printer.toolhead.axis_minimum.y+90} F6000                                # move gantry to the front
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      # save parked position in case toolhead is moved during the pause (otherwise the return zhop can error) 
        SET_IDLE_TIMEOUT TIMEOUT={xplorer.tmpout}                                                       # set timeout to 12 hours
    {% endif %}
    printpause_audio        
                
######################################################################
# Pause 2xGantry
######################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    M118 Pause print...
    # Parameters
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set z = params.Z|default(10)|int %}                                                             # z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                                        # set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}              # set hotend temp variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=e1temp VALUE={printer['extruder1'].target}
        SAVE_GCODE_STATE NAME=PAUSE                                                                    # save current print position for resume
        BASE_PAUSE                                                                                     # pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}                 # check that zhop doesn't exceed z max
            G91                                                                                        # relative positioning
            G1 Z{z} F900                                                                               # raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                            # if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                            # absolute positioning    
        G1 X11 Y{printer.toolhead.axis_maximum.y-100} F6000                                           # move gantry to the back
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                                # save parked position in case toolhead is moved during the pause (otherwise the return zhop can error) 
        	{% if printer.toolhead.extruder != "extruder1" %}
	    M104 T0 S150
    {% else %}
        M104 T1 S150
	{% endif %}
        #M104 S0                                                                                       # turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT={xplorer.tmpout}                                                                  # set timeout to 12 hours
    {% endif %}
    SET_GCODE_VARIABLE MACRO=filament_change_state1 VARIABLE=changet0busy VALUE=0
    SET_GCODE_VARIABLE MACRO=filament_change_state11 VARIABLE=changet1busy VALUE=0
    printpause_audio

######################################################################
# Resume 2xGantry
######################################################################

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_e1temp: 0

gcode:
      M118 Resuming printing...
        # Parameters
    {% set e = params.E|default(2.5)|int %}                                                                                # hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %} 
          SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}                                      # set timeout back to configured value
        {% if etemp > 0 %}
            M109 T0 S{etemp|int}                                                                                           # wait for hotend to heat back up
        {% endif %}
        {% if e1temp > 0 %}
            M109 T1 S{e1temp|int} 
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                                                           # go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                                                                # relative positioning
        M83                                                                                                                # relative extruder positioning
                                                                                                       # resume print
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                                                      # prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                                                           # lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %} 
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                                                                # restore position
        BASE_RESUME 

    {% endif %}
    printstart_audio
    
########################################################################################
# Cancel 2xGantry
########################################################################################

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    M118 CANCEL PRINT !
    SET_SKEW CLEAR=1
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE

    # If not printing from sdcard, reset file to stop streaming
    {% if printer["virtual_sdcard"] is defined and printer.virtual_sdcard.is_active|default(False) %}
        # Skip SDCARD_RESET_FILE when running from the sdcard to avoid error
    {% else %}
        SDCARD_RESET_FILE
    {% endif %}

    # Heaters and fans off (handle extra tools when present)
    M104 T0 S0
    M104 T1 S0
    {% if printer['extruder2'] is defined %}M104 T2 S0{% endif %}
    {% if printer['extruder3'] is defined %}M104 T3 S0{% endif %}
    M140 S0
    SET_FAN_SPEED FAN=Tool_0_partfan Speed=0.0
    SET_FAN_SPEED FAN=Tool_1_partfan Speed=0.0
    {% if printer['fan_generic Tool_2_partfan'] is defined %}SET_FAN_SPEED FAN=Tool_2_partfan Speed=0.0{% endif %}
    {% if printer['fan_generic Tool_3_partfan'] is defined %}SET_FAN_SPEED FAN=Tool_3_partfan Speed=0.0{% endif %}

    # Small retract and tiny z-hop if hot
    {% if (printer.extruder.can_extrude|lower == 'true') %}
        G91
        G1 E-3 F300
        M117 RETRACT
        G1 Z+0.5 E-3 F9000
        G1 E-10
        M117 WIPE OUT
    {% endif %}

    # Absolute mode, compute a safe Z raise (no homing Z)
    G90
    {% set axismax = printer.toolhead.axis_maximum %}
    {% set pos     = printer.toolhead.position %}
    {% set safe_z  = [pos.z + 5, axismax.z - 1]|min %}
    G1 Z{safe_z} F3000

    # Park ONLY the currently active tool; never switch tools during cancel
    {% if printer.toolhead.extruder == "extruder" %}
        PARK_extruder
    {% elif printer.toolhead.extruder == "extruder1" %}
        PARK_extruder1
    {% elif printer.toolhead.extruder == "extruder2" and printer['gcode_macro PARK_extruder2'] is defined %}
        PARK_extruder2
    {% elif printer.toolhead.extruder == "extruder3" and printer['gcode_macro PARK_extruder3'] is defined %}
        PARK_extruder3
    {% endif %}

    M117 PRESENT ITEM
    BED_MESH_CLEAR
    SAVE_VARIABLE VARIABLE=pmode VALUE=0
    SAVE_VARIABLE VARIABLE=ttovr VALUE=0
    SET_VELOCITY_LIMIT VELOCITY=300 ACCEL=5000
    M400
    SKEW_PROFILE LOAD=SKEW0
    BASE_CANCEL_PRINT
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Electronics_fan TARGET=50
    SET_GCODE_OFFSET Z=0 MOVE=0
    UPDATE_DELAYED_GCODE ID=SAVE_XY_TIMER DURATION=0
    SAVE_VARIABLE VARIABLE=xy_resume VALUE=1
    printcancel_audio

#########################################
# Resonance Calibration 2xGantry
########################################

[gcode_macro RESONANCE_CALIBRATION_DG_Mirror]
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    M118 This will measure the resonances on X and Y-Axis for Tool0.
    M118 The process may take a few minutes, so be patient.
    CHECK_HOME  
    ACTIVATE_MIRROR_MODE    
    G1 Z{xplorer.res_z} F2000
    TEST_RESONANCES AXIS=X POINT={xplorer.res_xmicpdg},{xplorer.res_y2micp4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonances_x_2xGantrymr
    TEST_RESONANCES AXIS=Y POINT={xplorer.res_xmicpdg},{xplorer.res_y2micp4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonances_y_2xGantrymr
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    G28 X
    G28 Y
    M118 Resonance test is complete. Check the PNG files for details
     
[gcode_macro RESONANCE_CALIBRATION_DG_Copy]
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    M118 This will measure the resonances on X and Y-Axis for Tool0.
    M118 The process may take a few minutes, so be patient.
    CHECK_HOME  
    ACTIVATE_COPY_MODE  
    G1 Z{xplorer.res_z} F2000
    TEST_RESONANCES AXIS=X POINT={xplorer.res_xmicpdg},{xplorer.res_y1micp4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonances_x_2xGantrycp
    TEST_RESONANCES AXIS=Y POINT={xplorer.res_xmicpdg},{xplorer.res_y1micp4e},{xplorer.res_z} ACCELEROMETER=Tool0
    RUN_SHELL_COMMAND CMD=resonances_y_2xGantrycp
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    G28 X
    G28 Y
    M118 Resonance test is complete. Check the PNG files for details
    
[gcode_macro RESONANCE_CALIBRATION_DG]
gcode:
     RESONANCE_CALIBRATION_DG_Copy
     RESONANCE_CALIBRATION_DG_Mirror
     M118 Resonance tests for 2xGantry printing modes are complete.

#########################################
# Printer Auto Calibrate 2xGantry
########################################

[gcode_macro Printer_Calibrate]
gcode:       
    printstart_audio
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    {% set svv = printer["save_variables"].variables %}
    M118 Starting printer calibration...
    M118 The calibration process takes up to 45 minutes ! Be patient !!! You can grab a coffe :)
    M104 T0 S{svv.tprobe}
    M104 T1 S{svv.tprobe}
    M140 S{svv.mesh_tmp}    
    M118 Calibration Bed Probe offset
    AUTO_CALIBRATE_probe_offset
    M118 Calibration Tools offsets
    AUTO_CALIBRATE_tool_offsets
    T0
    G1 X210 Y200 F10000
    G1 Z100 F2000
    M118 PID Calibration for Tool0
    PID_Tool0
    M104 T1 S{svv.tprobe}
    T1
    G1 X210 Y200 F10000
    M118 PID Calibration for Tool1
    PID_Tool1
    M104 T1 S{svv.tprobe}
    PARK_extruder1
    M118 PID Calibration for Print Bed
    PID_BED
    M118 Mesh leveling
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={svv.tprobe}
    Brush_Tool0
    T0    
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={svv.mesh_tmp}
    set_zmotors_offset
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE PROFILE=default METHOD=automatic # Start probing
    M104 T0 S0
    M104 T1 S0
    M118 Resonance Calibration
    RESONANCE_CALIBRATION_Tool0
    RESONANCE_CALIBRATION_Tool1
    RESONANCE_CALIBRATION_DG
    G28
    printend_audio
    SAVE_CONFIG

##################################
# Park Tool2 2xGantry/IQEX
##################################
[gcode_macro PARK_extruder2]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    # Ensure copy/mirror is not engaged on X (front pair) or Y before parking
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t3 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    # Front gantry (gantry1) and front X carriage (Tool2)
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    G1 Y449 F{xplorer.sp_tch}
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t2

    {% if svv.shaper_type_xt2 is defined and
          svv.shaper_freq_xt2 is defined and
          svv.shaper_type_yt2 is defined and
          svv.shaper_freq_yt2 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xt2} SHAPER_FREQ_X={svv.shaper_freq_xt2} SHAPER_TYPE_Y={svv.shaper_type_yt2} SHAPER_FREQ_Y={svv.shaper_freq_yt2}
    {% endif %}

    SAVE_GCODE_STATE NAME=park2
    G90
    SET_GCODE_OFFSET X=0
    SET_GCODE_OFFSET Y=0
    SET_VELOCITY_LIMIT VELOCITY=220 ACCEL=10000
    G1 X0 F{xplorer.sp_tch}
    #SET_VELOCITY_LIMIT VELOCITY=220 ACCEL=5000
    #G1 Y449 F{xplorer.sp_tchy}
    RESTORE_GCODE_STATE NAME=park2

##################################
# Park Tool3 2xGantry/IQEX
##################################
[gcode_macro PARK_extruder3]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    # Ensure copy/mirror is not engaged on X (front pair) or Y before parking
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t3 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY
    # Front gantry (gantry1) and front X carriage (Tool3)
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    G1 Y449 F{xplorer.sp_tch}
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t3

    {% if svv.shaper_type_xt3 is defined and
          svv.shaper_freq_xt3 is defined and
          svv.shaper_type_yt3 is defined and
          svv.shaper_freq_yt3 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xt3} SHAPER_FREQ_X={svv.shaper_freq_xt3} SHAPER_TYPE_Y={svv.shaper_type_yt3} SHAPER_FREQ_Y={svv.shaper_freq_yt3}
    {% endif %}

    SAVE_GCODE_STATE NAME=park3
    G90
    SET_GCODE_OFFSET X=0
    SET_GCODE_OFFSET Y=0
    SET_VELOCITY_LIMIT VELOCITY=220 ACCEL=10000
    G1 X419 F{xplorer.sp_tch}
    #SET_VELOCITY_LIMIT VELOCITY=220 ACCEL=5000
    #G1 Y0 F{xplorer.sp_tchy}
    RESTORE_GCODE_STATE NAME=park3

##################################
# Activate Tool2
##################################
[gcode_macro Tool2]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    G1 F{xplorer.sp_tch}
    {% if printer.toolhead.extruder != "extruder2" %}
        PARK_{printer.toolhead.extruder}
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder2
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t2
    {% if svv.shaper_type_xt2 is defined and svv.shaper_freq_xt2 is defined and svv.shaper_type_yt2 is defined and svv.shaper_freq_yt2 is defined %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={svv.shaper_type_xt2} SHAPER_FREQ_X={svv.shaper_freq_xt2} SHAPER_TYPE_Y={svv.shaper_type_yt2} SHAPER_FREQ_Y={svv.shaper_freq_yt2}
    {% endif %}
    {% set x2 = svv.x2offset|default(0)|float %}
    {% set y2 = (svv.y2offset|default(0)|float) - (xplorer.y_off_dg|default(0)|float) %}
    {% set z2 = svv.z2offset|default(0)|float %}
    SET_GCODE_OFFSET X={x2} Y={y2} Z={z2}

[gcode_macro T2]
gcode:

