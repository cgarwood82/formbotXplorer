##################################
# Axis X -- Carriage Tool0
##################################

#[carriage x]
#endstop_pin:~Tool0: PA10
#position_min: -1
#position_endstop: 0
#position_max: 340
#homing_speed: 180
#homing_retract_dist: 5.0
#homing_retract_speed: 50
#second_homing_speed: 10
#homing_positive_dir:

[stepper x]
#carriages: x
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 32
rotation_distance: 31.93                     #Califlower Calibration https://www.printables.com/model/682023-califlower-calibration-stl-calculator                    

[tmc2209 stepper x]
uart_pin: PB5
run_current: 0.95
interpolate: false
hold_current: 0.500
sense_resistor: 0.11 
stealthchop_threshold: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 0

[stepper x1]
#carriages: x
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 32
rotation_distance: 31.93                     #Califlower Calibration https://www.printables.com/model/682023-califlower-calibration-stl-calculator

[tmc2209 stepper x1]
uart_pin: PB9
run_current: 0.95
interpolate: false
hold_current: 0.500
sense_resistor: 0.11
stealthchop_threshold: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 0
