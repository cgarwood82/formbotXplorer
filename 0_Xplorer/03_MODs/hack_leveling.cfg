####################################
# Hack Leveling Macros (moved to 03_MODs)
# - TANGO_TIME: cleaning, Z tilt, mesh strategy, Z offset touch
# - PROBECALIBRATE: Cartographer calibration at center
# These macros assume Cartographer/Beacon routing via Z_SENSOR_PROBE_ONCE in hack_Macros_Base.cfg
####################################

[gcode_macro PROBECALIBRATE]
description: Cartographer probe calibration at bed center (safe for rear Y>=140)
gcode:
    G28
    G90
    Tool0
    # Ensure safe Z and legal Y (rear gantry min is 140)
    {% if printer.gcode_move.position.z < 5 %} G1 Z5 F3000 {% endif %}
    {% if printer.toolhead.position.y < 140 %} G1 Y140 F6000 {% endif %}
    G1 X200 Y200 F6000
    CARTOGRAPHER_TOUCH_CALIBRATE


[gcode_macro TANGO_TIME]
description: Level bed, prepare mesh and Z offset (IDEX/IQEX safe, rear-Y>=140)
# Params:
#  EXTRUDER (T0 temp), EXTRUDER1, EXTRUDER2, EXTRUDER3 for mesh strategy hints
#  SAFE_X/SAFE_Y/SAFE_Z for the neutral position after prep (defaults 210/200/10)
gcode:
    {% set e0 = params.EXTRUDER|default(0)|float %}
    {% set e1 = params.EXTRUDER1|default(0)|float %}
    {% set e2 = params.EXTRUDER2|default(0)|float %}
    {% set e3 = params.EXTRUDER3|default(0)|float %}
    {% set sx = params.SAFE_X|default(210)|float %}
    {% set sy = params.SAFE_Y|default(200)|float %}
    {% set sz = params.SAFE_Z|default(10)|float %}


    SET_DISPLAY_TEXT MSG='Heating Hot End to 150C'
    M109 S150 T0

    SET_DISPLAY_TEXT MSG='Cleaning Nozzle...'
    Brush_Tool0

    SET_DISPLAY_TEXT MSG='Z Tilt Adjust...'
    Z_TILT_ADJUST   ; uses hardened wrapper in 03_MODs/hack_probe.cfg

    # Mesh strategy: if ONLY T0 is heated (>0), do adaptive; otherwise load default
    {% set hot0 = 1 if e0 > 0 else 0 %}
    {% set hot1 = 1 if e1 > 0 else 0 %}
    {% set hot2 = 1 if e2 > 0 else 0 %}
    {% set hot3 = 1 if e3 > 0 else 0 %}
    {% set heated_tools = hot0 + hot1 + hot2 + hot3 %}

    BED_MESH_CLEAR
    {% if heated_tools == 0 %}
        { action_raise_error("No heated extruders detected — set at least one EXTRUDER temperature.") }
    {% elif hot0 == 1 and heated_tools == 1 %}
        SET_DISPLAY_TEXT MSG="Mesh: adaptive (T0 only)"
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=10
    {% else %}
        SET_DISPLAY_TEXT MSG="Mesh: loading 'default'"
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    # Leave at a neutral, legal spot (safe Z, then XY)
    {% if printer.gcode_move.position.z < sz %} G1 Z{sz} F3000 {% endif %}
    G1 X{sx} Y{sy} F9000

    SET_DISPLAY_TEXT MSG='Calibrating Z Offset'
    CARTOGRAPHER_TOUCH_HOME
