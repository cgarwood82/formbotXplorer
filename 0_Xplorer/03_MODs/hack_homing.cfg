####################################
# Hack Homing Macros (moved to 03_MODs)
# - IQEX/IDEX aware homing helpers
# - Safe Z home config
#
# Notes:
# - We do NOT override Klipper's built-in G28. Instead, we provide
#   HOME_* helpers you can call directly or from PRINT_START.
# - Rear gantry (gantry0) has Y>=140 min; macros avoid Y<140 before front
#   gantry is active.
####################################

# Safe Z Home (as provided)
[safe_z_home]
home_xy_position: 200, 200
speed: 50.0
z_hop: 0

####################################
# Prepare rear for Z actions (shared with probe/tilt logic)
####################################
[gcode_macro _PREPARE_REAR_T0]
gcode:
    G90
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t0
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    Tool0
    {% if printer.gcode_move.position.z < 5 %}
        G1 Z5 F3000
    {% endif %}
    {% if printer.toolhead.position.y < 140 %}
        G1 Y140 F6000
    {% endif %}

####################################
# Home X on all four carriages (rear T0/T1, front T2/T3)
####################################
[gcode_macro HOME_X_ALL]
description: Home X for T0, T1, T2, T3 sequentially (decouples first)
gcode:
    G90
    # Ensure X/Y pairs are independent before homing
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY

    # Rear X: T0 then T1
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t0
    G28 X
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t1
    G28 X

    # Front X: T2 then T3
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t2
    G28 X
    SET_DUAL_CARRIAGE CARRIAGE=carriage_t3
    G28 X

####################################
# Home Y on both gantries (rear then front)
####################################
[gcode_macro HOME_Y_BOTH]
description: Home Y for rear (gantry0) then front (gantry1)
gcode:
    G90
    # Decouple Y before homing
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left MODE=PRIMARY

    # Rear Y first (respect rear min)
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry0_left
    G28 Y

    # Front Y
    SET_DUAL_CARRIAGE CARRIAGE=carriage_gantry1_left
    G28 Y

####################################
# Home Z using Cartographer at center (rear/T0, safe for Y>=140)
####################################
[gcode_macro HOME_Z_CARTO]
description: Z home via Cartographer at 200,200 with rear/T0
gcode:
    _PREPARE_REAR_T0
    G1 X200 Y200 F6000
    {% if printer["cartographer"] is defined %}
        CARTOGRAPHER_TOUCH_HOME
    {% else %}
        # Fallback: use safe_z_home or base Z home
        G28 Z
    {% endif %}

####################################
# Home XY then Z (safe sequence for this machine)
####################################
[gcode_macro HOME_ALL]
description: Home X on all carriages, Y on both gantries, then Z via Cartographer
gcode:
    G90
    HOME_X_ALL
    HOME_Y_BOTH
    HOME_Z_CARTO
