####################################
# Hack Probe Macros (Cartographer/Beacon aware)
####################################
# This file centralizes probing-related macros so alternative probes
# (Cartographer, Beacon) can be supported automatically when present.

[gcode_macro Z_SENSOR_PROBE_ONCE]
gcode:
    {% if printer["cartographer"] is defined %}
        CARTOGRAPHER_TOUCH_PROBE
    {% elif printer["beacon"] is defined %}
        BEACON_PROBE
    {% else %}
        BASE_PROBE
    {% endif %}

[gcode_macro PROBE]
rename_existing: BASE_PROBE
variable_probex: 0.0
variable_probey: 0.0
gcode:
    {% if printer.toolhead.extruder != "extruder" %}
        {% set current_x = printer.toolhead.position.x %}
        {% set current_y = printer.toolhead.position.y %}
        SET_GCODE_VARIABLE MACRO=PROBE VARIABLE=probex VALUE={current_x|float}
        SET_GCODE_VARIABLE MACRO=PROBE VARIABLE=probey VALUE={current_y|float}
        {% if current_x < 20 or current_x > 340 or current_y < 25 or current_y > 400 %}
            M118 Probe Position outside the probing area!
        {% else %}
            T0
            G1 X{current_x} Y{current_y} F10000
            Z_SENSOR_PROBE_ONCE
        {% endif %}
    {% else %}
        {% if printer.toolhead.position.x < 20 or printer.toolhead.position.y < 25 or printer.toolhead.position.y > 400 %}
            M118 Probe Position outside the probing area!
        {% else %}
            Z_SENSOR_PROBE_ONCE
        {% endif %}
    {% endif %}

###################################
# SET Z-Motors offsets (uses PROBE)
###################################

[gcode_macro set_zmotors_offset]
gcode:
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    Tool0
    CHECK_HOME
    G90
    G1 Z10 F5000
    G1 X{xplorer.dg_mzx} Y{xplorer.dg_mzy} F10000 # Motor Z, reference
    Z_SENSOR_PROBE_ONCE
    _save_off_motorz
    G90
    G1 Z10 F5000
    G1 X{xplorer.dg_mz1x} Y{xplorer.dg_mz1y} F10000 # Motor Z1
    Z_SENSOR_PROBE_ONCE
    _save_off_motorz1
    G90
    G1 Z10 F5000
    G1 X{xplorer.dg_mz2x} Y{xplorer.dg_mz2y} F10000 # Motor Z2
    Z_SENSOR_PROBE_ONCE
    _save_off_motorz2
    G1 Z10 F5000
    G28 X
    G28 Y

####################################
# Apply Z-Motors offsets
####################################

[gcode_macro apply_zmotors_offsets]
gcode:
    {% set svv = printer.save_variables.variables %}

    {% set mot_z = svv.get("mot_z") %}
    {% set mot_z1 = svv.get("mot_z1") %}
    {% set mot_z2 = svv.get("mot_z2") %}

    {% if mot_z is not none and mot_z1 is not none and mot_z2 is not none %}

    # --- Probe locations from variables/macros (for reference only) ---
    # Using fixed motor coordinates for projection below

    # --- Motor locations ---
    {% set y_z1_motor = 537.5 %}
    {% set x_z2_motor = 481.1 %}

    # --- Calculate projected values at motor positions ---

    # For Z1: slope along Y
    {% set slope_y_z1 = (mot_z1 - mot_z) / (210 - 140) %}  # (y_z1 - y_z) nominal spacing
    {% set projected_z1 = mot_z1 + slope_y_z1 * (y_z1_motor - 210) %}
    {% set delta_z1 = ((projected_z1 - mot_z) - 0.3)|round(6) %}

    # For Z2: slope along X
    {% set slope_x_z2 = (mot_z2 - mot_z) / (340 - 80) %}   # (x_z2 - x_z) nominal spacing
    {% set projected_z2 = mot_z2 + slope_x_z2 * (x_z2_motor - 340) %}
    {% set delta_z2 = (projected_z2 - mot_z)|round(6) %}

    FORCE_MOVE STEPPER="stepper z1" DISTANCE={delta_z1} VELOCITY=5
    FORCE_MOVE STEPPER="stepper z2" DISTANCE={delta_z2} VELOCITY=5

    M118 Z-motors leveled

    {% else %}
    M118 Error: One or more Z probe offsets missing. Skipping alignment.
    {% endif %}

###################################
# Prepare rear gantry for Z tilt
###################################

[gcode_macro _PREPARE_FOR_Z_TILT]
gcode:
    # Ensure homed and force rear gantry + Tool0, clear offsets; clamp Y>=140
    CHECK_HOME
    G90
    SET_DUAL_CARRIAGE CARRIAGE=gantry0
    SET_DUAL_CARRIAGE CARRIAGE=t0
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    Tool0
    {% if printer.gcode_move.position.z < 10 %}
        G1 Z10 F3000
    {% endif %}
    {% if printer.toolhead.position.y < 140 %}
        G1 Y140 F6000
    {% endif %}

###################################
# Z_TILT_ADJUST wrapper (standalone safe)
###################################

[gcode_macro Z_TILT_ADJUST]
rename_existing: Z_TILT_ADJUST_BASE
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    _PREPARE_FOR_Z_TILT
    BED_MESH_CLEAR
    {% if not printer.z_tilt.applied %}
        Z_TILT_ADJUST_BASE horizontal_move_z=10 retry_tolerance=1
    {% endif %}
    Z_TILT_ADJUST_BASE horizontal_move_z=2
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT
