####################################
# Hack Logging Macros (diagnostics)
# - LOG_BEGIN/LOG_END/LOG_MARK emit markers to klippy.log
# - Use action_respond_info() so messages appear with "//" prefix
####################################

[gcode_macro LOG_BEGIN]
description: Emit a BEGIN marker into klippy.log
# Usage: LOG_BEGIN [MSG="text"]
gcode:
    {% set msg = params.MSG|default("") %}
    { action_respond_info("JOB_BEGIN " ~ msg) }

[gcode_macro LOG_END]
description: Emit an END marker into klippy.log
# Usage: LOG_END [MSG="text"]
gcode:
    {% set msg = params.MSG|default("") %}
    { action_respond_info("JOB_END " ~ msg) }

[gcode_macro LOG_MARK]
description: Emit a custom MARK into klippy.log
# Usage: LOG_MARK MSG="text"
gcode:
    {% if params.MSG is defined %}
        { action_respond_info("MARK: " ~ params.MSG) }
    {% else %}
        { action_respond_info("MARK") }
    {% endif %}
